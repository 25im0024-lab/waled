<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Coach</title>
<style>
:root{--bg:#06110f;--panel:#0c211c;--panel2:#081813;--line:#2f6858;--ink:#effff8;--muted:#9bb8ae;--green:#62efb2;--orange:#ffbb54;--blue:#55cbed;--red:#ff7878}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.65}
#app{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{margin:0;font:600 22px Consolas,monospace;color:var(--green)}
header p{margin:4px 0 0;font-size:12px;color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
nav button.on{background:#176344;border-color:var(--green)}
button{font:inherit;cursor:pointer;color:var(--ink);background:#102d26;border:1px solid var(--line);padding:8px 12px;border-radius:4px}
button.primary{background:#176344;border-color:var(--green)}
button.danger{border-color:#a85c5c;color:#ffcccc}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;color:var(--green);margin:0 0 10px}
.card h3{font-size:13px;color:var(--orange);margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row>*{flex:0 0 auto}.row>.grow{flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--panel2);padding:10px;border-radius:4px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font:600 20px Consolas,monospace}
.muted{color:var(--muted);font-size:12px}
.en{direction:ltr;text-align:left;font-family:Georgia,'Times New Roman',serif}
textarea,input,select{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:280px;resize:vertical;font-size:16px;line-height:1.7}
select{width:auto;max-width:100%}
.big{font-size:30px;margin:6px 0}
.q{background:var(--panel2);border-radius:4px;padding:10px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;direction:ltr;margin:4px 0}
.opt.right{border-color:var(--green);background:#14452f}.opt.wrong{border-color:var(--red);background:#4a1f1f}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.msg li{margin:5px 0}.msg{padding-inline-start:20px}
.diff span{padding:1px 3px;border-radius:3px;margin:0 1px}
.diff .miss{background:#4a1f1f;color:#ffb3b3}.diff .extra{background:#4a3a14;color:#ffd890;text-decoration:line-through}.diff .ok{background:none}
table{border-collapse:collapse;direction:ltr;margin:8px 0}
td,th{border:1px solid var(--line);padding:6px 12px;text-align:center}th{background:var(--panel2)}
.timer{font:600 20px Consolas,monospace;color:var(--orange)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.passage p{margin:.6em 0}
@media(max-width:520px){#app{padding:10px}.big{font-size:24px}}
</style>
</head>

<header>
  <div><h1>IELTS COACH</h1><p>تدريب يومي: Vocabulary · Grammar · Writing · Speaking · Listening · Reading</p></div>

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dayIdx=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const dayKey=d=>d.toLocaleDateString('en-CA');
const fmt=s=>`${String(Math.floor(Math.max(s,0)/60)).padStart(2,'0')}:${String(Math.max(s,0)%60).padStart(2,'0')}`;
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const toks=s=>String(s).toLowerCase().replace(/[’]/g,"'").match(/[a-z0-9]+(?:'[a-z]+)?/g)||[];

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}
}

/* ============ persistent state ============ */
const KEY='ielts_coach_v1';
const defaults={target:7,exam:'',vocab:{},custom:[],deckSel:'core',newToday:{day:0,n:0},grammar:{right:0,total:0,wrong:{}},days:{},writing:[],speaking:[],reading:[],listening:[]};
function load(){
  try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'))}
  catch(e){return structuredClone(defaults)}
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mark(){const k=dayKey(new Date());S.days[k]=(S.days[k]||0)+1;save()}
function streak(){
  let n=0;const d=new Date();
  if(!S.days[dayKey(d)])d.setDate(d.getDate()-1);
  while(S.days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ============ speech synthesis + timers ============ */
let voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)):[]}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function voiceOptions(){return voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('')||'<option value="">default</option>'}
function speak(text,{rate=.95,voice='',onend}={}){
  if(!window.speechSynthesis){alert('المتصفح لا يدعم النطق الصوتي (speechSynthesis).');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;
  const v=voices.find(v=>v.name===voice)||voices.find(v=>v.lang==='en-GB')||voices[0];
  if(v)u.voice=v;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);
}
function makeTimer(el){
  let id=null,left=0;
  return{
    start(sec,onEnd){
      this.stop();left=sec;el.textContent=fmt(left);
      id=setInterval(()=>{left--;el.textContent=fmt(left);if(left<=0){this.stop();if(onEnd)onEnd()}},1000);
    },
    stop(){clearInterval(id);id=null},
    get running(){return id!==null}
  };
}

/* ============ navigation ============ */
const TABS=[['home','الرئيسية'],['vocab','Vocabulary'],['grammar','Grammar'],['writing','Writing'],['speaking','Speaking'],['listening','Listening'],['reading','Reading']];
let cleanup=()=>{};
function show(t){
  cleanup();cleanup=()=>{};
  if(window.speechSynthesis)speechSynthesis.cancel();
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===t?'on':''}">${l}</button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
  $('#topinfo').textContent=`Streak: ${streak()} يوم · الهدف: Band ${S.target}`;
  ({home,vocab,grammar,writing,speaking,listening,reading})[t]();
  window.scrollTo(0,0);
}

const NEW_PER_DAY=10;
function getDecks(){
  const d={};
  for(const [k,v] of Object.entries(DECKS))d[k]={name:v.name,words:v.words.map(w=>({key:k+':'+w[0],en:w[0],pos:w[1],ar:w[2],ex:w[3]}))};
  d.mine={name:'كلماتي',words:S.custom.map(w=>({key:'mine:'+w.en,en:w.en,pos:'',ar:w.ar,ex:w.ex||''}))};
  return d;
}
function wordsOf(id){const d=getDecks();return id==='all'?Object.values(d).flatMap(x=>x.words):(d[id]?d[id].words:[])}

  ['The research ___ that regular sleep improves memory.',['suggests','suggest'],0,'"The research" مفرد (غير معدود) ← suggests.'],
  ['Pollution has a negative ___ on public health.',['effect','affect'],0,'effect = noun (أثر)، affect = verb (يؤثر). "have an effect on".'],
  ['She is very interested ___ renewable energy.',['in','on','at'],0,'interested in.'],
  ['Despite ___ expensive, the project was approved.',['being','it was','of being'],0,'Despite + noun/-ing. لا نقول "despite of".'],
  ['___ people drive to work than ten years ago.',['Fewer','Less'],0,'fewer + countable (people)، less + uncountable.'],
  ['By 2050, the population ___ by about 20%.',['will have risen','will rise','has risen'],0,'By + وقت مستقبلي ← future perfect للدلالة على اكتمال الحدث قبل ذلك الوقت.'],
  ['Children ___ spend too long on screens are at higher risk.',['who','which','whom'],0,'who للأشخاص كفاعل في relative clause.'],
  ['There is a growing ___ for skilled engineers.',['demand','request','ask'],0,'a demand for (collocation).'],

/* ============ VOCABULARY (Leitner spaced repetition) ============ */
function vocab(){
  const decks=getDecks();
  if(S.deckSel!=='all'&&!decks[S.deckSel])S.deckSel='core';
  let queue=[],failed=new Set(),shown=false;
  const t0=dayIdx();
  const build=()=>{
    const ws=wordsOf(S.deckSel);
    const used=S.newToday.day===t0?S.newToday.n:0;
    const due=ws.filter(w=>S.vocab[w.key]&&S.vocab[w.key].due<=t0);
    const fresh=ws.filter(w=>!S.vocab[w.key]).slice(0,Math.max(0,NEW_PER_DAY-used));
    queue=shuffle(due).concat(fresh);
  };
  const draw=()=>{
    const ws=wordsOf(S.deckSel);
    const cnt=[0,0,0,0];
    ws.forEach(w=>{const r=S.vocab[w.key];if(!r)cnt[0]++;else if(r.box<=2)cnt[1]++;else if(r.box<=4)cnt[2]++;else cnt[3]++});
    $('#vprog').innerHTML=`جديدة <b>${cnt[0]}</b> · قيد التعلم <b>${cnt[1]}</b> · مراجعة <b>${cnt[2]}</b> · متقنة <b>${cnt[3]}</b>`;
    const w=queue[0];
    if(!w){$('#vcard').innerHTML=`<p class="ok">انتهت جلسة اليوم لهذه المجموعة. عد غدًا للمراجعة، أو غيّر المجموعة.</p>`;return}
    $('#vcard').innerHTML=`<p class="muted">متبقي في الجلسة: ${queue.length}</p>
      <div class="en big">${esc(w.en)} <small class="muted">${esc(w.pos)}</small></div>
      <div class="row"><button id="say">🔊 نطق</button>${shown?'':'<button class="primary" id="rev">إظهار المعنى</button>'}</div>
      ${shown?`<p class="big">${esc(w.ar)}</p><p class="en muted">${esc(w.ex)}</p>
      <div class="row"><button id="no" class="danger">لم أعرفها</button><button id="yes" class="primary">عرفتها</button></div>`:''}`;
    $('#say').onclick=()=>speak(w.en+'. '+w.ex);
    if(!shown)$('#rev').onclick=()=>{shown=true;draw()};
    else{$('#yes').onclick=()=>answer(true);$('#no').onclick=()=>answer(false)}
  };
  const answer=ok=>{
    const w=queue.shift(),t=dayIdx();
    let r=S.vocab[w.key];
    if(!r){r=S.vocab[w.key]={box:0,due:t};if(S.newToday.day!==t)S.newToday={day:t,n:0};S.newToday.n++}
    if(ok&&!failed.has(w.key)){r.box=Math.min(5,r.box+1);r.due=t+INT[r.box]}
    else if(ok){r.box=1;r.due=t+1}
    else{failed.add(w.key);r.box=1;r.due=t;queue.push(w)}
    mark();shown=false;draw();
  };
  $('#view').innerHTML=`<div class="card"><h2>Vocabulary — تكرار متباعد (Leitner)</h2>
    <div class="row"><select id="deck">${Object.entries(decks).map(([k,d])=>`<option value="${k}" ${k===S.deckSel?'selected':''}>${esc(d.name)} (${d.words.length})</option>`).join('')}<option value="all" ${S.deckSel==='all'?'selected':''}>الكل</option></select>
    <button id="more">+10 كلمات جديدة اليوم</button></div>
    <p class="muted" id="vprog"></p><div id="vcard" class="q"></div>
    <p class="muted">الكلمة التي تعرفها تتباعد مراجعتها (1 ← 3 ← 7 ← 14 ← 30 يومًا). الخطأ يعيدها للصندوق الأول. أقصى كلمات جديدة يوميًا: ${NEW_PER_DAY}.</p></div>
    <div class="card"><h2>أضف كلمة من قراءاتك</h2>
    <div class="row"><input class="grow en" id="ne" placeholder="English word / phrase"><input class="grow" id="na" placeholder="المعنى بالعربية"></div>
    <div class="row"><input class="grow en" id="nx" placeholder="Example sentence (optional)"><button id="add" class="primary">إضافة</button></div></div>`;
  $('#deck').onchange=e=>{S.deckSel=e.target.value;save();vocab()};
  $('#more').onclick=()=>{if(S.newToday.day===dayIdx())S.newToday.n=Math.max(0,S.newToday.n-10);save();build();shown=false;draw()};
  $('#add').onclick=()=>{
    const en=$('#ne').value.trim(),ar=$('#na').value.trim();
    if(!en||!ar)return;
    if(S.custom.some(c=>c.en.toLowerCase()===en.toLowerCase()))return alert('الكلمة موجودة');
    S.custom.push({en,ar,ex:$('#nx').value.trim()});save();S.deckSel='mine';save();vocab();
  };
  build();draw();
}

/* ============ GRAMMAR quiz ============ */
function grammar(){
  const wrongIds=Object.keys(S.grammar.wrong).map(Number);
  const pool=shuffle(GRAMMAR);
  const prior=pool.filter(q=>wrongIds.includes(q.id));
  const rest=pool.filter(q=>!wrongIds.includes(q.id));
  const quiz=prior.concat(rest).slice(0,10);
  let i=0,right=0,locked=false;
  const draw=()=>{
    if(i>=quiz.length){
      $('#view').innerHTML=`<div class="card"><h2>النتيجة</h2><p class="big">${right} / ${quiz.length}</p>
        <p class="muted">الأسئلة التي أخطأت فيها تظهر أولًا في الجلسة القادمة حتى تجيبها صح (الحذف يتم عند الإجابة الصحيحة).</p>
        <div class="row"><button class="primary" id="again">جلسة جديدة</button><button id="hm">الرئيسية</button></div></div>`;
      $('#again').onclick=grammar;$('#hm').onclick=()=>show('home');return;
    }
    const q=quiz[i];
    const order=shuffle(q.opts.map((o,k)=>[o,k]));
    locked=false;
    $('#view').innerHTML=`<div class="card"><h2>Grammar — ${i+1}/${quiz.length}</h2>
      <div class="bar"><i style="width:${100*i/quiz.length}%"></i></div>
      <p class="en big" style="font-size:20px">${esc(q.q)}</p>
      ${order.map(([o,k])=>`<button class="opt en" data-k="${k}">${esc(o)}</button>`).join('')}
      <div id="fb"></div></div>`;
    $$('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;
      const ok=+b.dataset.k===q.ans;
      S.grammar.total++;
      if(ok){S.grammar.right++;right++;delete S.grammar.wrong[q.id]}else S.grammar.wrong[q.id]=(S.grammar.wrong[q.id]||0)+1;
      $$('.opt').forEach(x=>{if(+x.dataset.k===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
      mark();
      $('#fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'صحيح':'خطأ'}</p><p>${esc(q.why)}</p><button class="primary" id="nx">التالي</button>`;
      $('#nx').onclick=()=>{i++;draw()};
    });
  };
  draw();
}

/* ============ WRITING ============ */
const LINKERS=['however','moreover','furthermore','in addition','therefore','consequently','as a result','for instance','for example','in contrast','on the other hand','nevertheless','although','whereas','while','in conclusion','to sum up','overall','thus','similarly','despite','in particular','by contrast','nonetheless','additionally'];
const STOP=new Set('the a an and or but of to in on at for with by from as is are was were be been being it its this that these those they their them he she his her we our you your i not no can could may might will would should must have has had do does did so than then also more most such there which who whom what when where how why if into over under about between among through during after before because while although'.split(' '));
const INFORMAL=[
  [/\ba lot of\b/gi,'a lot of → substantial / considerable / numerous',1],
  [/\blots of\b/gi,'lots of → numerous / a great deal of',1],
  [/\bkids\b/gi,'kids → children',1],
  [/\bstuff\b/gi,'stuff → حدّد الشيء بدقة',1],
  [/\betc\b\.?/gi,'etc → تجنّبها؛ أعطِ مثالًا إضافيًا',1],
  [/\band so on\b/gi,'and so on → تجنّبها',1],
  [/\bthings?\b/gi,'thing(s) → استبدلها باسم محدد (factor, aspect, issue…)',3],
  [/\b(get|gets|getting|got)\b/gi,'get/got → obtain / receive / become / acquire',3],
  [/\bbig\b/gi,'big → significant / major / substantial',3],
  [/\bgood\b/gi,'good → beneficial / effective / positive',3],
  [/\bbad\b/gi,'bad → harmful / detrimental / negative',3]
];
const COMMON_ERR=[
  [/\binformations\b/i,'informations ← information (غير معدود)'],
  [/\badvices\b/i,'advices ← advice (غير معدود)'],
  [/\bequipments\b/i,'equipments ← equipment (غير معدود)'],
  [/\bfurnitures\b/i,'furnitures ← furniture (غير معدود)'],
  [/\bknowledges\b/i,'knowledges ← knowledge (غير معدود)'],
  [/\bpeoples\b/i,'peoples ← people (جمع بالفعل، إلا إن قصدت "شعوب")'],
  [/\bin the other hand\b/i,'in the other hand ← on the other hand'],
  [/\bmore (better|easier|cheaper|harder|faster)\b/i,'double comparative: لا تجمع more مع -er'],
  [/\bmost of people\b/i,'most of people ← most people / most of the people'],
  [/\bdespite of\b/i,'despite of ← despite (بدون of) أو in spite of']
];
function analyzeWriting(text,task){
  const out=[];const add=(l,m)=>out.push({l,m});
  const words=text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[];
  const n=words.length,min=task==='Task 1'?150:250;
  if(n<min)add('bad',`عدد الكلمات ${n} أقل من الحد الأدنى (${min}). النقص يؤثر على Task Achievement/Response.`);
  else add('ok',`عدد الكلمات ${n} (الحد الأدنى ${min}).`);
  if(n<30)return out;
  const paras=text.split(/\n\s*\n/).filter(p=>p.trim()).length;
  if(task==='Task 2'){
    if(paras<4)add('warn',`فقرات مفصولة بسطر فارغ: ${paras}. الشائع: introduction + فقرتا body على الأقل + conclusion.`);
    else add('ok',`عدد الفقرات: ${paras}.`);
    if(!/\b(in conclusion|to conclude|to sum up|in summary|overall)\b/i.test(text))add('warn','لا توجد عبارة conclusion واضحة (in conclusion / to sum up).');
  }else{
    if(!/\b(overall|in general|in summary|to summarise|to summarize)\b/i.test(text))add('bad','لا يوجد overview واضح (Overall…). غيابه أكبر خطأ شائع في Task 1.');
    else add('ok','يوجد overview.');
    if(!/\d/.test(text))add('warn','لا توجد أرقام: أيّد الاتجاهات ببيانات من الجدول.');
    if(/\b(i think|in my opinion|i believe)\b/i.test(text))add('bad','Task 1 وصف للبيانات: لا تضف رأيًا شخصيًا.');
  }
  const sents=text.match(/[^.!?]+[.!?]+/g)||[text];
  const avg=n/sents.length;
  if(avg<12)add('warn',`متوسط طول الجملة ${avg.toFixed(1)} كلمة: قصير. ادمج بعض الجمل باستخدام complex sentences.`);
  else if(avg>28)add('warn',`متوسط طول الجملة ${avg.toFixed(1)} كلمة: طويل وقد يضر بالوضوح.`);
  else add('ok',`متوسط طول الجملة ${avg.toFixed(1)} كلمة.`);
  const starters={};sents.forEach(s=>{const w=(s.trim().split(/\s+/)[0]||'').toLowerCase().replace(/[^a-z]/g,'');if(w)starters[w]=(starters[w]||0)+1});
  const rep=Object.entries(starters).filter(([,c])=>c>=3);
  if(rep.length)add('warn','جمل كثيرة تبدأ بنفس الكلمة: '+rep.map(([w,c])=>`"${w}" ×${c}`).join('، '));
  const low=text.toLowerCase();
  const used=LINKERS.map(l=>[l,(low.match(new RegExp('\\b'+l+'\\b','g'))||[]).length]).filter(x=>x[1]>0);
  if(used.length<3)add('warn',`روابط (cohesive devices) مستخدمة: ${used.length}. نوّع: however, therefore, for instance…`);
  else add('ok','روابط مستخدمة: '+used.map(([l,c])=>l+(c>1?` ×${c}`:'')).join('، '));
  const over=used.filter(x=>x[1]>=4);
  if(over.length)add('warn','إفراط في الربط الآلي: '+over.map(x=>`${x[0]} ×${x[1]}`).join('، ')+'. الروابط الكثيرة لا ترفع الـ band بحد ذاتها.');
  const lw=words.map(w=>w.toLowerCase());
  const ttr=new Set(lw).size/lw.length;
  add(ttr<.45?'warn':'ok',`تنوّع المفردات (type-token ratio): ${ttr.toFixed(2)} — مؤشر تقريبي يتأثر بطول النص.`);
  const cnt={};lw.forEach(w=>{if(!STOP.has(w)&&w.length>3)cnt[w]=(cnt[w]||0)+1});
  const rw=Object.entries(cnt).filter(([,c])=>c>=5).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(rw.length)add('warn','كلمات محتوى مكررة: '+rw.map(([w,c])=>`${w} ×${c}`).join('، ')+'. استخدم synonyms أو pronouns.');
  if(/\b\w+(n't|'re|'ve|'ll|'d|'m)\b/i.test(text.replace(/’/g,"'")))add('bad','contractions (don\'t, it\'s…) غير مناسبة للأسلوب الأكاديمي.');
  if(/(^|[\s"(])i(?=[\s,.!?;:']|’)/m.test(text))add('bad','ضمير I مكتوب بحرف صغير.');
  if(/\?/.test(text))add('warn','أسئلة بلاغية (rhetorical questions): تجنّبها في المقال الأكاديمي.');
  if(/!/.test(text))add('warn','علامة تعجب: غير مناسبة في الكتابة الأكاديمية.');
  const inf=INFORMAL.map(([re,msg,th])=>[msg,(text.match(re)||[]).length,th]).filter(x=>x[1]>=x[2]);
  inf.forEach(([msg,c])=>add('warn',`كلمة عامة/غير رسمية ×${c}: ${msg}`));
  COMMON_ERR.forEach(([re,msg])=>{if(re.test(text))add('bad',msg)});
  if(task==='Task 2'){
    const me=(low.match(/\b(i think|in my opinion|i believe|i agree|i disagree|i feel)\b/g)||[]).length;
    if(me>3)add('warn',`عبارات الرأي الشخصي ×${me}: أبدِ الرأي مرة أو مرتين بوضوح (مقدمة + خاتمة) وليس في كل جملة.`);
  }
  return out;
}

    $('#wmin').textContent=`الحد الأدنى: ${min}`;
    $('#tmr').textContent=fmt(task==='Task 1'?1200:2400);
    $('#wq').innerHTML=`<p><b>${esc(item.type)}</b> — ${esc(item.q)}</p>`+(item.head?`<table><tr>${item.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${item.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table><p class="muted">${esc(item.note)}</p>`:'');
  };
  const count=()=>{const n=(wa.value.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length;const c=$('#wc');c.textContent=n+' words';c.className=n<(task==='Task 1'?150:250)?'warn':'ok';return n};
  const newQ=()=>{item=pick(task==='Task 1'?T1:T2);tm.stop();setQ()};
  $('#wt').onchange=e=>{task=e.target.value;newQ();count()};
  $('#nq').onclick=newQ;
  $('#ts').onclick=()=>tm.start(task==='Task 1'?1200:2400,()=>{$('#tmr').style.color='var(--red)'});
  $('#tx').onclick=()=>tm.stop();
  wa.oninput=count;
  $('#an').onclick=()=>{
    const r=analyzeWriting(wa.value,task);
    $('#res').innerHTML=`<h3>ملاحظات آلية (heuristics — ليست Band)</h3><ul class="msg">${r.map(x=>`<li class="${x.l}">${x.l==='ok'?'✓':x.l==='warn'?'!':'✗'} ${esc(x.m)}</li>`).join('')}</ul><p class="muted">هذه فحوص شكلية فقط؛ لا تقيس جودة الحجة ولا دقة النحو كاملةً.</p>`;
  };
  $('#cp').onclick=async()=>{
    const qtxt=item.q+(item.head?'\n'+[item.head,...item.rows].map(r=>r.join(' | ')).join('\n'):'');
    const p=`Act as a strict, certified IELTS examiner. Assess my Academic Writing ${task} response against the four official band descriptors (Task ${task==='Task 1'?'Achievement':'Response'}, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy). Give a band (half bands allowed) for each criterion with brief evidence from my text, then the overall band. List my 5 most important errors with corrections and the rule behind each. Rewrite my two weakest sentences at Band 8 level. I am a native Arabic speaker: reply in Arabic but keep technical terms in English. Do not inflate the band.\n\nQuestion:\n${qtxt}\n\nMy answer (${count()} words):\n${wa.value}`;
    alert(await copyText(p)?'تم النسخ. الصقه في محادثة Claude.':'تعذّر النسخ تلقائيًا.');
  };
  const calc=()=>{
    const v=$$('.sa').map(s=>parseFloat(s.value)).filter(x=>!isNaN(x));
    const o=$('#ov');
    if(v.length<4){o.textContent='';return null}
    const b=Math.round(v.reduce((a,c)=>a+c,0)/4*2)/2;
    o.textContent='Overall (self): '+b;return b;
  };
  $$('.sa').forEach(s=>s.onchange=calc);
  const hist=()=>{
    $('#hist').innerHTML=S.writing.length?S.writing.slice(-5).reverse().map(w=>`<p class="en">${esc(w.date)} · ${esc(w.task)} · ${w.words} words${w.self?' · self '+w.self:''}</p>`).join(''):'<p class="muted">لا توجد محاولات محفوظة بعد.</p>';
  };
  $('#sv').onclick=()=>{
    const w=count();if(w<30)return alert('اكتب نصًا أطول أولًا.');
    S.writing.push({date:dayKey(new Date()),task,words:w,self:calc(),text:wa.value.slice(0,6000)});mark();hist();
  };
  setQ();count();hist();
}

/* ============ SPEAKING ============ */
function speaking(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let part=1,card=null,q='',rec=null,mr=null,stream=null,chunks=[],finalText='',recording=false,t0=0;
  $('#view').innerHTML=`<div class="card"><h2>Speaking Lab</h2>
    <div class="row"><select id="sp"><option value="1">Part 1 (أسئلة قصيرة)</option><option value="2">Part 2 (Cue card)</option><option value="3">Part 3 (نقاش)</option></select><button id="nq">سؤال جديد</button><button id="rd">🔊 اقرأ السؤال</button></div>
    <div id="sq" class="q en"></div>
    <div class="row" id="p2row" hidden><span class="timer" id="tmr">01:00</span><button id="prep">ابدأ دقيقة التحضير</button></div>
    <div class="row"><button class="primary" id="rc">⏺ ابدأ التسجيل</button><button id="st" disabled>⏹ إيقاف</button></div>
    <audio id="au" controls hidden></audio>
    <div class="q en" id="tr" style="min-height:50px" aria-live="polite"></div>
    <div id="stats"></div>
    <p id="note" class="muted">${SR?'التفريغ النصي الآلي (Chrome/Edge) يساعدك على عدّ الكلمات والـ fillers، لكنه غير دقيق مع بعض اللهجات ولا يقيّم النطق.':'متصفحك لا يدعم التفريغ النصي؛ التسجيل والاستماع فقط (جرّب Chrome).'}</p></div>
    <div class="card"><h2>طريقة الاستخدام</h2><ul class="muted">
      <li>Part 1: 20–30 ثانية للإجابة: إجابة مباشرة + سبب أو مثال، بلا إطالة.</li>
      <li>Part 2: دقيقة تحضير ثم تحدّث 1–2 دقيقة دون توقف؛ غطِّ نقاط الـ cue card كلها.</li>
      <li>Part 3: إجابات أطول (30–45 ث) مع رأي، سبب، ومقارنة أو مثال عام.</li>
      <li>استمع لتسجيلك مرة وركّز على: التردد، تكرار الكلمات نفسها، الأخطاء النحوية الواضحة.</li></ul></div>`;
  const tm=makeTimer($('#tmr'));
  cleanup=()=>{tm.stop();stopRec(true)};
  const setQ=()=>{
    $('#p2row').hidden=part!==2;tm.stop();$('#tmr').textContent='01:00';
    if(part===1){q=pick(SP1);$('#sq').innerHTML=`<p>${esc(q)}</p>`}
    else if(part===2){card=pick(SP2);q=card.t;$('#sq').innerHTML=`<p><b>${esc(card.t)}</b></p><p>You should say:</p><ul>${card.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`}
    else{card=card||pick(SP2);q=pick(card.p3);$('#sq').innerHTML=`<p>${esc(q)}</p><p class="muted">(مرتبط بموضوع: ${esc(card.t)})</p>`}
  };
  $('#sp').onchange=e=>{part=+e.target.value;if(part===3&&!card)card=pick(SP2);setQ()};
  $('#nq').onclick=()=>{if(part===3)card=pick(SP2);setQ()};
  $('#rd').onclick=()=>speak(q);
  $('#prep').onclick=()=>tm.start(60,()=>{$('#tmr').textContent='ابدأ التحدث!'});
  const stopRec=silent=>{
    recording=false;
    try{if(rec)rec.stop()}catch(_){}
    try{if(mr&&mr.state!=='inactive')mr.stop()}catch(_){}
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=null;
    if(!silent&&$('#rc')){$('#rc').disabled=false;$('#st').disabled=true}
  };
  const finish=()=>{
    const dur=(Date.now()-t0)/1000,words=toks(finalText),n=words.length;
    const fill=(finalText.toLowerCase().match(/\b(um+|uh+|erm?|you know|i mean|like)\b/g)||[]).length;
    const wpm=dur>5?Math.round(n/(dur/60)):0;
    $('#stats').innerHTML=`<div class="grid"><div class="stat"><small>المدة</small><b>${fmt(Math.round(dur))}</b></div>
      ${SR?`<div class="stat"><small>كلمات (تفريغ آلي)</small><b>${n}</b></div><div class="stat"><small>كلمة/دقيقة</small><b>${wpm}</b></div><div class="stat"><small>fillers محتملة</small><b>${fill}</b></div>`:''}</div>
      ${SR?'<p class="muted">الكلام الطبيعي غالبًا 110–160 كلمة/دقيقة (تقدير عام، ليس معيارًا رسميًا). كلمة like قد تكون استخدامًا سليمًا فلا تعدّها خطأ تلقائيًا.</p>':''}
      <div class="row"><button id="cpS">نسخ prompt لـ Claude</button></div>`;
    S.speaking.push({date:dayKey(new Date()),part,dur:Math.round(dur),words:n});mark();
    const b=$('#cpS');
    if(b)b.onclick=async()=>{
      const p=`Act as a strict certified IELTS Speaking examiner. Below is an automatic transcript (may contain recognition errors; ignore pronunciation) of my answer to an IELTS Speaking Part ${part} question. Assess Fluency & Coherence, Lexical Resource and Grammatical Range & Accuracy (give a band for each, half bands allowed, with evidence). List my main grammar/vocabulary errors with corrections and give a Band 8 model answer. I am a native Arabic speaker: reply in Arabic but keep technical terms in English.\n\nQuestion: ${q}\nDuration: ${Math.round(dur)} s\nTranscript:\n${finalText||'(not available — I will paste my own transcript)'}`;
      alert(await copyText(p)?'تم النسخ.':'تعذّر النسخ تلقائيًا.');
    };
  };
  $('#rc').onclick=async()=>{
    finalText='';chunks=[];$('#tr').textContent='';$('#stats').innerHTML='';$('#au').hidden=true;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
    catch(e){$('#note').textContent='تعذّر الوصول إلى الميكروفون: '+e.message+' (تحتاج https أو localhost وإذنًا من المتصفح).';return}
    try{
      mr=new MediaRecorder(stream);
      mr.ondataavailable=e=>chunks.push(e.data);
      mr.onstop=()=>{$('#au').src=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType}));$('#au').hidden=false};
      mr.start();
    }catch(e){mr=null}
    if(SR){
      rec=new SR();rec.lang='en-GB';rec.continuous=true;rec.interimResults=true;
      rec.onresult=e=>{let interim='';for(let k=e.resultIndex;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)finalText+=r[0].transcript+' ';else interim+=r[0].transcript}$('#tr').textContent=finalText+interim};
      rec.onend=()=>{if(recording){try{rec.start()}catch(_){}}else if(t0){finish();t0=0}};
      try{rec.start()}catch(_){}
    }
    t0=Date.now();recording=true;$('#rc').disabled=true;$('#st').disabled=false;
  };
  $('#st').onclick=()=>{
    const hadSR=!!rec;
    stopRec(false);
    if(!hadSR&&t0){finish();t0=0}
  };
  setQ();
}

/* ============ LISTENING ============ */
function diffWords(exp,got){
  const a=toks(exp),b=toks(got),n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){out.push(['ok',a[i]]);i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push(['miss',a[i]]);i++}
    else{out.push(['extra',b[j]]);j++}
  }
  while(i<n)out.push(['miss',a[i++]]);
  while(j<m)out.push(['extra',b[j++]]);
  return{out,score:Math.round(100*dp[0][0]/Math.max(n,1))};
}
function listening(){
  let mode='gap';
  const draw=()=>{
    $('#view').innerHTML=`<div class="card"><h2>Listening</h2><div class="row">
      <button id="mg" class="${mode==='gap'?'primary':''}">Section-style gap-fill</button><button id="md" class="${mode==='dict'?'primary':''}">Dictation</button>
      <select id="vo">${voiceOptions()}</select><label>السرعة <select id="rt"><option value=".8">0.8</option><option value=".95" selected>0.95</option><option value="1.1">1.1</option></select></label></div>
      <p class="muted">الصوت هنا synthetic (TTS) بصوت متصفحك، وليس لهجات حقيقية كما في الاختبار. مفيد لتدريب الأرقام والتهجئة والانتباه، ولا يغني عن تسجيلات Cambridge الرسمية.</p></div><div id="lbody"></div>`;
    $('#mg').onclick=()=>{mode='gap';draw()};$('#md').onclick=()=>{mode='dict';draw()};
    const opts=()=>({voice:$('#vo').value,rate:+$('#rt').value});
    if(mode==='gap')gap(opts);else dict(opts);
  };
  const gap=opts=>{
    let played=false;
    $('#lbody').innerHTML=`<div class="card"><h2>Fill in the blanks (one word and/or a number)</h2>
      <div class="row"><button class="primary" id="pl">▶ شغّل</button><label><input type="checkbox" id="once"> وضع الاختبار: تشغيل مرة واحدة</label></div>
      ${LISTEN.gaps.map((g,k)=>`<div class="q en"><span>${k+1}. ${esc(g[0]).replace('______','<input data-k="'+k+'" class="ans" style="width:130px;display:inline-block" autocomplete="off">')}</span><span class="fb" id="f${k}"></span></div>`).join('')}
      <div class="row"><button class="primary" id="ck">تحقّق</button><button id="tx">أظهر النص</button></div><div id="gres"></div></div>`;
    $('#pl').onclick=()=>{
      if($('#once').checked&&played)return alert('وضع الاختبار: لا يمكن الإعادة.');
      played=true;speak(LISTEN.text,opts());
    };
    $('#ck').onclick=()=>{
      let ok=0;
      LISTEN.gaps.forEach((g,k)=>{
        const v=norm($(`.ans[data-k="${k}"]`).value),good=g[1].some(a=>norm(a)===v);
        if(good)ok++;
        $('#f'+k).innerHTML=good?' <span class="ok">✓</span>':` <span class="bad">✗ (${esc(g[1][0])})</span>`;
      });
      S.listening.push({date:dayKey(new Date()),type:'gap',score:ok,of:LISTEN.gaps.length});mark();
      $('#gres').innerHTML=`<p class="big">${ok} / ${LISTEN.gaps.length}</p>`;
    };
    $('#tx').onclick=()=>{$('#gres').insertAdjacentHTML('beforeend',`<p class="en q">${esc(LISTEN.text)}</p>`)};
  };
  const dict=opts=>{
    let i=-1;
    $('#lbody').innerHTML=`<div class="card"><h2>Dictation</h2>
      <p class="muted">استمع واكتب ما سمعته حرفيًا. تُقارن الكلمات (بدون حساسية لحالة الأحرف أو علامات الترقيم).</p>
      <div class="row"><button class="primary" id="nx">جملة جديدة</button><button id="rp">🔊 أعد</button></div>
      <textarea class="en" id="dt" style="min-height:90px" placeholder="Type what you hear…"></textarea>
      <div class="row"><button class="primary" id="ck">تحقّق</button></div><div id="dres"></div></div>`;
    $('#nx').onclick=()=>{i=Math.floor(Math.random()*LISTEN.dictation.length);$('#dt').value='';$('#dres').innerHTML='';speak(LISTEN.dictation[i],opts())};
    $('#rp').onclick=()=>{if(i>=0)speak(LISTEN.dictation[i],opts())};
    $('#ck').onclick=()=>{
      if(i<0)return;
      const r=diffWords(LISTEN.dictation[i],$('#dt').value);
      S.listening.push({date:dayKey(new Date()),type:'dict',score:r.score,of:100});mark();
      $('#dres').innerHTML=`<p class="big">${r.score}%</p><p class="en diff">${r.out.map(([t,w])=>`<span class="${t}">${esc(w)}</span>`).join(' ')}</p>
        <p class="muted"><span class="diff"><span class="miss">أحمر</span></span> كلمة فاتتك · <span class="diff"><span class="extra">مشطوب</span></span> كلمة زائدة/خاطئة</p><p class="en q">${esc(LISTEN.dictation[i])}</p>`;
    };
  };
  draw();
}

/* ============ READING ============ */
function reading(){
  const tm=makeTimer({set textContent(v){const e=$('#tmr');if(e)e.textContent=v}});
  cleanup=()=>tm.stop();
  const opts=[['T','True'],['F','False'],['NG','Not Given']];
  $('#view').innerHTML=`<div class="card"><h2>Reading — ${esc(READ.title)}</h2>
    <div class="row"><span class="timer" id="tmr">20:00</span><button id="ts">ابدأ مؤقت 20 دقيقة</button></div>
    <div class="passage en">${READ.text.map((p,k)=>`<p><b>${String.fromCharCode(65+k)}</b> ${esc(p)}</p>`).join('')}</div></div>
    <div class="card"><h2>True / False / Not Given</h2>
    <p class="muted en">True = النص يؤكد · False = النص يناقض · Not Given = لا معلومة عنه في النص. لا تستخدم معلوماتك الخارجية.</p>
    ${READ.tfng.map((q,k)=>`<div class="q en"><p>${k+1}. ${esc(q[0])}</p><div class="row">${opts.map(o=>`<label><input type="radio" name="t${k}" value="${o[0]}"> ${o[1]}</label>`).join('')}</div><p class="muted" id="e${k}"></p></div>`).join('')}</div>
    <div class="card"><h2>Sentence completion (NO MORE THAN TWO WORDS)</h2>
    ${READ.gaps.map((g,k)=>`<div class="q en"><span>${READ.tfng.length+k+1}. ${esc(g[0]).replace('______',`<input class="gp" data-k="${k}" style="width:140px;display:inline-block" autocomplete="off">`)}</span><p class="muted" id="g${k}"></p></div>`).join('')}</div>
    <div class="row"><button class="primary" id="ck">تحقّق</button></div><div id="rres"></div>`;
  $('#ts').onclick=()=>tm.start(1200,()=>{$('#tmr').style.color='var(--red)'});
  $('#ck').onclick=()=>{
    tm.stop();let ok=0;
    READ.tfng.forEach((q,k)=>{
      const s=document.querySelector(`input[name=t${k}]:checked`),good=s&&s.value===q[1];
      if(good)ok++;
      $('#e'+k).innerHTML=`<span class="${good?'ok':'bad'}">${good?'✓ صحيح':'✗ الإجابة: '+q[1]}</span> — ${esc(q[2])}`;
    });
    READ.gaps.forEach((g,k)=>{
      const v=norm($(`.gp[data-k="${k}"]`).value),good=g[1].some(a=>norm(a)===v);
      if(good)ok++;
      $('#g'+k).innerHTML=`<span class="${good?'ok':'bad'}">${good?'✓ صحيح':'✗ الإجابة: '+esc(g[1][0])}</span> — ${esc(g[2])}`;
    });
    const total=READ.tfng.length+READ.gaps.length;
    S.reading.push({date:dayKey(new Date()),score:ok,of:total});mark();
    $('#rres').innerHTML=`<p class="big">${ok} / ${total}</p><p class="muted">لإضافة نصوص جديدة عدّل الكائن READ في أعلى الملف (نفس البنية).</p>`;
  };
}

show('home');
