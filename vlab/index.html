<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frac Gel Lab 3D — مختبر جل التكسير</title>
<meta name="description" content="3D virtual lab for a NaOA/KCl/guar wormlike-micelle fracturing gel: preparation, nano view, rheometer, proppant settling, heating and breakers.">
<meta name="theme-color" content="#0f9d76">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c" aria-label="3D gel bench"></canvas>

<header class="top">
  <a class="home" href="../" data-i="home" title="">⌂</a>
  <b class="brand" data-i="brand"></b>
  <nav class="lessons" role="tablist">
    <button role="tab" data-lesson="gel"><span class="n">1</span><span class="full" data-i="lessonGel"></span><span class="short" data-i="lessonGelS"></span></button>
    <button role="tab" data-lesson="break"><span class="n">2</span><span class="full" data-i="lessonBreak"></span><span class="short" data-i="lessonBreakS"></span></button>
  </nav>
  <div class="tools">
    <button id="btnLang" class="ghost">EN</button>
    <button id="btnPresent" class="ghost" data-i="present"></button>
    <button id="btnReset" class="ghost" data-i="reset"></button>
  </div>
</header>

<aside class="card stepcard" id="stepcard">
  <button class="collapse" id="btnCollapse" aria-label="collapse">▾</button>
  <div class="kicker"><span id="stepNo"></span><span id="stepDone" class="done" hidden>✓</span></div>
  <h2 id="stepTitle"></h2>
  <p id="stepText"></p>
  <div id="stepConf" class="conf"></div>
  <div class="nav">
    <button id="prev" class="ghost" aria-label="previous">‹</button>
    <button id="doit" class="pri" data-i="doit"></button>
    <button id="next" class="ghost" aria-label="next">›</button>
  </div>
  <div class="ctl" id="lessonControls"></div>
</aside>

<aside class="card instrument" id="instrument">
  <div class="row between"><h3 id="instTitle"></h3><span id="instBadge" class="pill"></span></div>
  <div class="seg" id="plotTabs" hidden></div>
  <canvas id="plot"></canvas>
  <div id="readouts" class="readouts"></div>
  <p class="note" id="instNote"></p>
</aside>

<div class="card nano" id="nanoBox" hidden>
  <canvas id="nano"></canvas>
  <div class="nanoCap"><b data-i="nano"></b> · <span id="nanoPhase"></span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>JavaScript and WebGL are required.</noscript>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/model.js"></script>
<script src="js/app.js"></script>
<script src="js/gel.js"></script>
<script src="js/break.js"></script>
<script>VL.start();</script>
</body>
</html>
