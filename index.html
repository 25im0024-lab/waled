<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>منظور الطيران — محاكي ثلاثي الأبعاد</title>
  <style>
    :root { --mint:#72ffd5; --dim:#8ca99f; --panel:rgba(7,19,16,.88); --line:rgba(111,255,213,.28); }
    * { box-sizing:border-box } body { margin:0; overflow:hidden; background:#020806; color:#e4fff6; font-family:Tahoma,Arial,sans-serif; }
    #stage { position:fixed; inset:0; } canvas { display:block; }
    .hud { position:fixed; inset:18px; pointer-events:none; }
    header { display:flex; direction:ltr; justify-content:space-between; align-items:flex-start; text-transform:uppercase; letter-spacing:2px; font-family:Consolas,monospace; }
    h1 { margin:0; color:#effff9; font-size:22px; } .subtitle { color:var(--mint); font-size:12px; margin-top:7px; }
    .meta { text-align:right; color:var(--dim); font-size:12px; line-height:1.7; } .meta b { color:#ffbd57; }
    .panel { pointer-events:auto; position:absolute; left:0; bottom:0; width:min(340px,calc(100vw - 36px)); background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; box-shadow:0 10px 35px #0009; }
    .panel h2 { margin:0 0 12px; font-size:14px; letter-spacing:1px; color:var(--mint); }
    .row { display:flex; gap:8px; margin:8px 0; } button { flex:1; border:1px solid var(--line); color:#d9fff2; background:#0a1b16; padding:10px 7px; font:12px Consolas,monospace; cursor:pointer; transition:.2s; }
    button:hover, button.active { border-color:var(--mint); color:var(--mint); background:#0e2921; } button.launch { border-color:#ffbd57; color:#ffcf81; }
    label { display:block; color:var(--dim); font:11px Consolas,monospace; margin:13px 0 5px; } input { width:100%; accent-color:var(--mint); }
    .readout { display:flex; justify-content:space-between; color:#d8fff1; font:12px Consolas,monospace; }
    .status { position:absolute; right:0; bottom:0; text-align:right; color:var(--dim); font:11px Consolas,monospace; line-height:1.8; }
    .status strong { color:var(--mint); } .hint { color:#78958b; font-size:10px; margin-top:12px; }
    @media(max-width:600px){ .hud{inset:12px} h1{font-size:16px}.panel{padding:12px}.meta{font-size:10px} }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="hud">
    <header><div><h1>منظور الطيران / FLIGHT VIEWER</h1><div class="subtitle">نموذج إجرائي ثلاثي الأبعاد — وضع الإقلاع</div></div><div class="meta">TAIL NO. <b>86-0324</b><br>UNIT: 401 TFW · READY</div></header>
    <section class="panel"><h2>// التحكم بالمهمة</h2>
      <div class="row"><button id="takeoff">إعادة الإقلاع</button><button class="launch" id="launch">إطلاق الصاروخ</button></div>
      <div class="row"><button class="active camera" data-cam="overview">منظور عام</button><button class="camera" data-cam="side">جانبي</button><button class="camera" data-cam="top">علوي</button></div>
      <label>مدى الصاروخ <span id="rangeText">45</span> كم</label><input id="range" type="range" min="15" max="120" value="45" />
      <div class="readout"><span>ارتفاع: <b id="alt">0000</b> م</span><span>سرعة: <b id="speed">000</b> كم/س</span></div>
      <div class="hint">اسحب لتدوير المشهد · عجلة الفأرة للتقريب</div>
    </section>
    <div class="status"><strong id="state">STANDBY</strong><br><span id="detail">RUNWAY SYSTEM ONLINE</span></div>
  </div>
  <script>
    /* Self-contained canvas renderer: no CDN or external WebGL library is needed. */
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),altEl=document.querySelector('#alt'),speedEl=document.querySelector('#speed'),stateEl=document.querySelector('#state'),detailEl=document.querySelector('#detail'),takeoffBtn=document.querySelector('#takeoff'),launchBtn=document.querySelector('#launch');document.querySelector('#stage').appendChild(canvas);
    let view='overview',phase='idle',t=0,last=performance.now(),missile=false,drag=false,spin=0;
    const range=document.querySelector('#range'),rangeText=document.querySelector('#rangeText');
    function size(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();
    function pt(x,y,z){let a=view==='top'?0:spin, X=x*Math.cos(a)-z*Math.sin(a),Z=x*Math.sin(a)+z*Math.cos(a);if(view==='top')return [innerWidth/2+X*17,innerHeight*.52+Z*17];let scale=560/(Z+36);return [innerWidth/2+X*scale,innerHeight*.53-y*scale]}
    function poly(p,color,stroke){ctx.beginPath();p.forEach((v,i)=>{let q=pt(...v);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
    function line(points,color,width=1,dash=[]){ctx.beginPath();points.forEach((v,i)=>{let q=pt(...v);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
    function drawGrid(){ctx.fillStyle='#020806';ctx.fillRect(0,0,innerWidth,innerHeight);for(let i=-50;i<=50;i+=5){line([[i,0,-55],[i,0,48]],i===0?'#176e58':'#0a3026');line([[-50,0,i],[50,0,i]],'#0a3026')}poly([[-3,0,-55],[3,0,-55],[3,0,48],[-3,0,48]],'#0b1d18','#1a5747');for(let z=-48;z<44;z+=7)poly([[-.18,.03,z],[.18,.03,z],[.18,.03,z+3],[-.18,.03,z+3]],'#66e6c3')}
    function drawJet(x,y,z,pitch){ctx.save();const L=6;poly([[x-L/2,y,z],[x+L/2,y,z],[x+L/2,y+.55,z],[x-L/2,y+.55,z]],'#91dfc9','#cbfff0');poly([[x+L/2,y,z],[x+L/2+1.5,y+.25,z],[x+L/2,y+.55,z]],'#d4fff2');poly([[x-.8,y+.15,z],[x+1.2,y+.15,z],[x-1.5,y+.15,z+5],[x-1.5,y+.15,z-5]],'#8edfc7','#d8fff2');poly([[x-2.6,y+.3,z],[x-3.6,y+.3,z],[x-3.2,y+2.2,z]],'#9de6d2');poly([[x+.3,y+.56,z],[x+1.8,y+.56,z],[x+1.25,y+1.15,z]],'#14564b','#7bffd9');line([[x-3.2,y+.25,z],[x-5.2,y+.25,z]],'#ffb13d',3);ctx.restore()}
    function drawMissile(p){line([[p[0]-.8,p[1],p[2]],[p[0]+.9,p[1],p[2]]],'#ffe2a2',3);poly([[p[0]+.9,p[1],p[2]],[p[0]+.5,p[1]+.18,p[2]],[p[0]+.5,p[1]-.18,p[2]]],'#fff3d2')}
    function setState(a,b){stateEl.textContent=a;detailEl.textContent=b}
    function render(now){let dt=(now-last)/1000;last=now;if(phase==='takeoff')t+=dt;if(phase==='missile')t+=dt;drawGrid();let x=-1,y=.7,z=15;if(phase==='takeoff'){x+=t*3.7;y+=Math.max(0,t-1.6)*1.35;altEl.textContent=Math.floor(Math.max(0,t-1.6)*135).toString().padStart(4,'0');speedEl.textContent=Math.min(820,Math.floor(160+t*72)).toString().padStart(3,'0');if(t>7){phase='flying';setState('AIRBORNE','WEAPONS SYSTEM READY')}}drawJet(x,y,z,0);if(missile){let p=Math.min(t/4.5,1),d=+range.value/4,mp=[x+p*d,y+1+Math.sin(p*Math.PI)*Math.min(d*.18,6),z-p*5];line([[x+1,y+.2,z],mp],'#ffb950',2,[7,6]);drawMissile(mp);altEl.textContent=Math.floor(mp[1]*100).toString().padStart(4,'0');speedEl.textContent=Math.floor(850+p*1100);if(p===1){missile=false;phase='flying';setState('TARGET REACHED','MISSILE RANGE COMPLETE')}}requestAnimationFrame(render)}render(performance.now());
    takeoffBtn.onclick=()=>{phase='takeoff';t=0;missile=false;setState('TAKEOFF','ACCELERATING ON RUNWAY')};launchBtn.onclick=()=>{if(phase==='idle')takeoffBtn.onclick();phase='missile';t=0;missile=true;setState('MISSILE AWAY','GUIDED RANGE: '+range.value+' KM')};
    range.oninput=()=>rangeText.textContent=range.value;document.querySelectorAll('.camera').forEach(b=>b.onclick=()=>{view=b.dataset.cam;document.querySelectorAll('.camera').forEach(e=>e.classList.remove('active'));b.classList.add('active')});
    canvas.onpointerdown=e=>{drag=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag&&view==='overview')spin+=e.movementX*.006};canvas.onpointerup=()=>drag=false;
  </script>
</body></html>
