<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a5c6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رحلة البرميل">
<meta name="description" content="أداة تفاعلية تشرح مسار النفط من قاع البئر إلى التصدير، مع تبويب للتكسير الهيدروليكي وحاسبات هندسية.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>رحلة البرميل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: drawing-board app. Sticky tab rail on top, shared "field case" drawer under it,
   then one working surface per tab: explanation on the right, instruments (inputs/outputs) beside it. */
:root{
  --bg:#e7ecee; --surface:#f6f9f9; --surface2:#dbe4e7; --ink:#10212a; --muted:#4c5f68; --line:#bdcace;
  --accent:#0a5b6d; --accent-ink:#ffffff; --accent-soft:#cfe4e9;
  --oil:#97560a; --oil-bg:#ecd6b3; --water:#1a5fa3; --water-bg:#c9def2; --gas:#a93526; --gas-bg:#f1cfc8;
  --ok:#1b6f43; --warn:#9a6200; --bad:#ae2219; --ok-bg:#d3ebdc; --warn-bg:#f5e4bd; --bad-bg:#f6d4d0;
  --earth:#d9d0c2; --earth2:#c7bdac;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171b; --surface:#142126; --surface2:#1d2e34; --ink:#e4edef; --muted:#93a8af; --line:#2b3d44;
  --accent:#56bccf; --accent-ink:#06222a; --accent-soft:#17353d;
  --oil:#e5a652; --oil-bg:#40301b; --water:#62aeea; --water-bg:#193349; --gas:#ec8173; --gas-bg:#4a2621;
  --ok:#5fcf93; --warn:#e8b552; --bad:#f08a80; --ok-bg:#173a27; --warn-bg:#41330f; --bad-bg:#47201d;
  --earth:#2b2a27; --earth2:#23221f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171b; --surface:#142126; --surface2:#1d2e34; --ink:#e4edef; --muted:#93a8af; --line:#2b3d44;
  --accent:#56bccf; --accent-ink:#06222a; --accent-soft:#17353d;
  --oil:#e5a652; --oil-bg:#40301b; --water:#62aeea; --water-bg:#193349; --gas:#ec8173; --gas-bg:#4a2621;
  --ok:#5fcf93; --warn:#e8b552; --bad:#f08a80; --ok-bg:#173a27; --warn-bg:#41330f; --bad-bg:#47201d;
  --earth:#2b2a27; --earth2:#23221f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:0 48px;margin:0}
#app{max-width:1240px;margin-inline:auto}
h1,h2,h3,h4{line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:8px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:0}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab:hover{color:var(--ink)}

/* shared case drawer */
details.case{margin-block:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.case>summary{cursor:pointer;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;list-style:none}
details.case>summary::-webkit-details-marker{display:none}
details.case>summary b{font-weight:700}
details.case>summary .sum{color:var(--muted);font-size:13px;font-family:var(--mono);direction:ltr}
details.case>summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.case[open]>summary::before{transform:rotate(90deg)}
.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;padding:4px 14px 14px}
.case-grp{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.case-grp:first-child{border:0;padding:0;margin:0}

/* sections */
.pane{padding-block:22px 0}
.pane[hidden]{display:none}
.lead{max-width:78ch;color:var(--ink)}
.sec{margin-top:30px}
.sec>h2{font-size:19px;font-weight:700;padding-bottom:6px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.sec>h2 small{color:var(--muted);font-weight:500;font-size:13px;margin-inline-start:8px}
.sec p+p{margin-top:8px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:900px){.twocol{grid-template-columns:minmax(0,1fr)}}
.note{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:2px;margin-top:10px;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
ul.tight{margin:6px 0 0;padding-inline-start:20px}
ul.tight li{margin-block:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:9px;line-height:1.7;vertical-align:1px;margin-inline:2px}
.b-est{background:var(--ok-bg);color:var(--ok)}
.b-inf{background:var(--warn-bg);color:var(--warn)}
.b-spec{background:var(--bad-bg);color:var(--bad)}

/* calculator panel */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.calc>h3{font-size:16px;font-weight:700;margin-bottom:2px}
.calc>.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.calc-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
@media (max-width:820px){.calc-body{grid-template-columns:minmax(0,1fr)}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;align-content:start}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.fl{font-size:12.5px;color:var(--muted);line-height:1.4}
.fi{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--bg);min-width:0}
.fi:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fi input,.fi select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:14px;padding:6px 8px;direction:ltr;text-align:left}
.fi select{font-family:var(--font);direction:rtl;text-align:right}
.fi input:focus,.fi select:focus{outline:0}
.fi b{font-weight:500;font-size:11.5px;color:var(--muted);padding-inline:6px;font-family:var(--mono);direction:ltr;white-space:nowrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface2);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.out{display:flex;flex-direction:column;gap:12px;min-width:0}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kv{border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--bg);min-width:0}
.kv small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.kv strong{font-family:var(--mono);font-size:17px;font-weight:600;direction:ltr;display:block;text-align:right;overflow-wrap:anywhere}
.kv strong i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.kv.ok{border-color:var(--ok)} .kv.warn{border-color:var(--warn)} .kv.bad{border-color:var(--bad)}
.kv.ok strong{color:var(--ok)} .kv.warn strong{color:var(--warn)} .kv.bad strong{color:var(--bad)}
.msg{font-size:13.5px;padding:7px 10px;border-radius:4px;background:var(--surface2)}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.bad{background:var(--bad-bg);color:var(--bad)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:5px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface2)}
td.n,th.n{text-align:end;font-family:var(--mono);direction:ltr;font-variant-numeric:tabular-nums}
tr.hi td{background:var(--ok-bg);font-weight:600}
tr:last-child td{border-bottom:0}
.chart{width:100%;height:auto;display:block;max-width:100%}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .tt{fill:var(--ink);font-family:var(--font);font-size:12px}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .gridl{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 3}
figure{margin:0}
figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}

/* map */
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
#mapsvg{min-width:1120px;width:100%;height:auto;display:block;direction:ltr}
#mapsvg text{font-family:var(--font);fill:var(--ink)}
#mapsvg .lb{font-size:14px;font-weight:600}
#mapsvg .la{font-size:13px;fill:var(--muted)}
#mapsvg .ls{font-size:12px;fill:var(--muted);font-family:var(--mono)}
#mapsvg .zone{font-size:14px;font-weight:700;fill:var(--muted);letter-spacing:.03em}
#mapsvg .sky{fill:var(--surface)}
#mapsvg .earth{fill:var(--earth)}
#mapsvg .ground{stroke:var(--ink);stroke-width:2}
#mapsvg .strata{stroke:var(--earth2);stroke-width:2;stroke-dasharray:10 6;fill:none}
#mapsvg .eq{fill:var(--surface);stroke:var(--ink);stroke-width:2}
#mapsvg .eq2{fill:none;stroke:var(--ink);stroke-width:2}
#mapsvg .thin{fill:none;stroke:var(--ink);stroke-width:1.4}
#mapsvg .tub{fill:none;stroke:var(--ink);stroke-width:5}
#mapsvg .perf{stroke:var(--ink);stroke-width:2}
#mapsvg .f-gas{fill:var(--gas-bg)} #mapsvg .f-oil{fill:var(--oil-bg)} #mapsvg .f-water{fill:var(--water-bg)}
#mapsvg .fill-gas{fill:var(--gas)}
#mapsvg .ln{fill:none;stroke-width:3.2;stroke-linejoin:round}
#mapsvg .ln-oil{stroke:var(--oil)} #mapsvg .ln-gas{stroke:var(--gas)} #mapsvg .ln-water{stroke:var(--water)} #mapsvg .ln-mix{stroke:var(--ink);stroke-width:2.6}
#mapsvg .flow{stroke-dasharray:9 7;animation:flow 1.1s linear infinite}
#mapsvg .m-oil{fill:var(--oil)} #mapsvg .m-gas{fill:var(--gas)} #mapsvg .m-water{fill:var(--water)} #mapsvg .m-ink{fill:var(--ink)}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){#mapsvg .flow{animation:none}}
#mapsvg .node{cursor:pointer}
#mapsvg .hl{fill:var(--accent);opacity:0}
#mapsvg .node:hover .hl{opacity:.08}
#mapsvg .node.sel .hl{opacity:.16}
#mapsvg .node.sel .eq,#mapsvg .node.sel .eq2{stroke:var(--accent);stroke-width:3}
#mapsvg .badgeN circle{fill:var(--ink)}
#mapsvg .badgeN text{fill:var(--bg);font-size:12.5px;font-weight:700;font-family:var(--mono)}
#mapsvg .node.sel .badgeN circle{fill:var(--accent)}
#mapsvg .node.sel .badgeN text{fill:var(--accent-ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-inline-end:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:2px 11px;font-size:13px;cursor:pointer}
.step[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.step small{font-family:var(--mono);margin-inline-end:5px;opacity:.75}
.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
.detail h3{font-size:18px}
.detail h3 .en{font-family:var(--mono);font-size:13px;color:var(--muted);margin-inline-start:8px;direction:ltr;unicode-bidi:isolate}
.detail h4{font-size:13px;color:var(--muted);font-weight:600;margin-top:12px;letter-spacing:.03em}
.detail p{margin-top:8px}
.detail .nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
dl.cond{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0;font-size:13.5px}
dl.cond dt{color:var(--muted)} dl.cond dd{margin:0}

/* trouble cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px;min-width:0}
.tcard h3{font-size:16px}
.tcard .sym{color:var(--muted);font-size:13.5px;margin-top:4px}
.tcard h4{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.04em}
.tcard ul{margin:3px 0 0;padding-inline-start:18px;font-size:13.5px}
.tcard .tg{font-size:11.5px;color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:1px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* glossary */
.gsearch{width:100%;max-width:420px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);padding:7px 10px;font-family:var(--font);font-size:14px;margin-bottom:10px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 24px}
.gloss div{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.gloss b{font-family:var(--mono);font-size:13px;direction:ltr;unicode-bidi:isolate;display:inline-block;margin-inline-end:6px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

/* hydraulic fracturing tab */
.simbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.simbar input[type=range],.f input[type=range]{accent-color:var(--accent)}
.simopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px;margin:10px 0}
.canvaswrap{border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow-x:auto;overflow-y:hidden}
.canvaswrap canvas{display:block;width:100%;min-width:760px;height:auto;aspect-ratio:1000/440}
.canvaswrap canvas#prcv{aspect-ratio:1000/460}
.phchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#spreadsvg,#ppsvg{min-width:760px;width:100%;height:auto;display:block;direction:ltr}
#spreadsvg .sprbg,#ppsvg .sprbg{fill:var(--surface)}
.eqb{fill:var(--surface2);stroke:var(--ink);stroke-width:1.6}
.eqb.big{fill:var(--accent-soft)} .eqb.pump{fill:var(--surface)}
.eqt{font-family:var(--font);font-size:14px;fill:var(--ink)}
.eqt.dim{fill:var(--muted);font-size:12.5px}
.eqhl{fill:var(--accent);opacity:0}
.eqn{cursor:pointer}
.eqn:hover .eqhl{opacity:.1}
.eqn.sel .eqhl{opacity:.2}
.sl{fill:none;stroke-width:3}
.sl.lw{stroke:var(--water)} .sl.lc{stroke:var(--muted)} .sl.lp{stroke:var(--oil)} .sl.lh{stroke:var(--ink);stroke-width:4}
.sl.flow{stroke-dasharray:9 7;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){.sl.flow{animation:none}}
.ppfr{stroke-linecap:round}
#ppsvg .ppplug{fill:var(--ink)}

/* realistic scenes */
#spreadsvg text,#ppsvg text{font-family:var(--font)}
#spreadsvg .tg1,#ppsvg .tg1{font-size:13px;font-weight:600;fill:var(--ink)}
#spreadsvg .tg2,#ppsvg .tg2{font-size:12px;fill:var(--muted)}
#ppsvg .tg1e{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:end}
#ppsvg .tg2e{font-size:12px;fill:var(--muted);text-anchor:end}
#spreadsvg .tg3,#ppsvg .tg3{font-size:12px;font-family:var(--mono);fill:var(--muted)}
.sl2{fill:none;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.sl2.lw{stroke:var(--water)} .sl2.lc{stroke:var(--muted)} .sl2.lh{stroke:var(--ink);stroke-width:4}
.sl2.flow{stroke-dasharray:9 7;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){.sl2.flow{animation:none}}
#spreadsvg .eqn:hover{filter:drop-shadow(0 0 3px var(--accent))}
#spreadsvg .eqn.sel{filter:drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 2px var(--accent))}

/* production facility (isometric) */
#mapsvg{min-width:900px}
#mapsvg .tg1{font-size:13px;font-weight:600;fill:var(--ink)}
#mapsvg .tg3{font-size:12px;font-family:var(--mono);fill:var(--muted)}
#mapsvg .pl{fill:none;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
#mapsvg .pl.oil{stroke:var(--oil)} #mapsvg .pl.gas{stroke:var(--gas)} #mapsvg .pl.water{stroke:var(--water)} #mapsvg .pl.mix{stroke:var(--ink)}
#mapsvg .pl,#mapsvg path.flow{stroke-dasharray:9 7;animation:flow calc(1.2s / var(--spd,1)) linear infinite}
#mapsvg.paused .pl,#mapsvg.paused path.flow{animation-play-state:paused}
#mapsvg.off-well .pl-well,#mapsvg.off-oil .pl-oil,#mapsvg.off-water .pl-water,#mapsvg.off-gas .pl-gas,#mapsvg.off-gas2 .pl-gas2,#mapsvg.off-flare .pl-flare,#mapsvg.off-export .pl-export{animation-play-state:paused;opacity:.28}
#mapsvg .flame{display:none;transform-box:fill-box}
#mapsvg.flare-on .flame{display:block;animation:flick .35s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.86,1.14)}}
@media (prefers-reduced-motion:reduce){#mapsvg .pl,#mapsvg path.flow,#mapsvg.flare-on .flame{animation:none}}
#mapsvg .node:hover{filter:drop-shadow(0 0 3px var(--accent))}
#mapsvg .node.sel{filter:drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 2px var(--accent))}
.opsbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 0}
.opsbar .btn[aria-pressed="true"]{border-color:var(--ok)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);font-weight:600}
.btn.danger[aria-pressed="true"]{background:var(--bad);color:#fff}
.fl b.mono{direction:ltr;unicode-bidi:isolate}
</style>

</head>
<body>
<div id="app"></div>
<script>
/*CORE-START*/
/* ===== Pure engineering functions (field units unless stated) ===== */
const C = {
  rhoW: 62.37,        // lb/ft3 fresh water @ 60F
  lbPerBblW: 350.2,   // lb per bbl fresh water
  gasLbScf: 0.0763,   // lb/scf per unit gas SG (air 28.964/379.48)
  ft3Bbl: 5.6146,
  g: 32.174

const apiToSG = api => 141.5 / (131.5 + api);

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function lineChart(o) {
  const W = 640, H = 330, L = 58, R = 16, T = 16, B = 44;
  const xm = o.xmax, ym = o.ymax;
  const X = x => L + (x / xm) * (W - L - R), Y = y => T + (1 - y / ym) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria || ''}">`;
  for (let i = 0; i <= 5; i++) {
    const yv = ym * i / 5, xv = xm * i / 5;
    s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${Y(yv)}" y2="${Y(yv)}"/><text x="${L - 6}" y="${Y(yv) + 4}" text-anchor="end">${fmt(yv, 0)}</text>`;
    s += `<text x="${X(xv)}" y="${H - B + 16}" text-anchor="middle">${fmt(xv, 0)}</text>`;
  }
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">${o.xlab}</text><text transform="rotate(-90)" x="${-(T + H - B) / 2}" y="13" text-anchor="middle">${o.ylab}</text>`;
  (o.hlines || []).forEach(h => { if (h.y <= ym) s += `<line x1="${L}" x2="${W - R}" y1="${Y(h.y)}" y2="${Y(h.y)}" style="stroke:${h.color};stroke-width:1.2;stroke-dasharray:5 4"/><text x="${W - R - 4}" y="${Y(h.y) - 4}" text-anchor="end" style="fill:${h.color}">${h.label}</text>`; });
  (o.series || []).forEach(se => {
    const pts = se.pts.filter(p => isFinite(p[0]) && isFinite(p[1]) && p[0] <= xm && p[1] <= ym * 1.0001 && p[1] >= 0);
    if (pts.length > 1) s += `<polyline points="${pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}" style="fill:none;stroke:${se.color};stroke-width:${se.w || 2.4};${se.dash ? 'stroke-dasharray:6 4;' : ''}stroke-linejoin:round"/>`;
  });
  (o.marks || []).forEach(m => { s += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="5.5" style="fill:${m.color || 'var(--ink)'};stroke:var(--bg);stroke-width:2"/><text class="tt" x="${X(m.x) + (m.dx || 10)}" y="${Y(m.y) + (m.dy || -8)}" text-anchor="${m.anchor || 'start'}">${m.label}</text>`; });
  let lx = L + 8;
  (o.series || []).forEach((se, i) => { s += `<line x1="${lx}" x2="${lx + 18}" y1="${T + 8 + i * 15}" y2="${T + 8 + i * 15}" style="stroke:${se.color};stroke-width:2.4;${se.dash ? 'stroke-dasharray:6 4' : ''}"/><text class="tt" x="${lx + 24}" y="${T + 12 + i * 15}">${se.label}</text>`; });
  return s + '</svg>';
}

function flowbackSVG() {
  const W = 560, H = 250, L = 40, R = 12, T = 14, B = 34;
  const x = t => L + t / 60 * (W - L - R), y = v => T + (1 - v) * (H - T - B);
  const curve = f => { let d = ''; for (let t = 0; t <= 60; t += 2) d += (t ? ' L' : 'M') + x(t).toFixed(1) + ' ' + y(f(t)).toFixed(1); return d; };
  const gel = t => 0.9 * Math.exp(-t / 6) + 0.02, solids = t => 0.85 * Math.exp(-t / 2.5) + 0.02, gas = t => Math.min(1, 0.12 + 0.85 * (1 - Math.exp(-t / 10))) * Math.exp(-t / 90), oil = t => 0.7 * (1 - Math.exp(-t / 15)) + 0.04;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم توضيحي: تتراجع حصة الـ gel والـ proppant في الـ flowback بسرعة بينما ترتفع حصة الغاز والنفط">`;
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/>`;
  [0, 15, 30, 45, 60].forEach(t => s += `<text x="${x(t)}" y="${H - B + 15}" text-anchor="middle">${t}</text>`);
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">الأيام بعد بدء الـ flowback</text><text transform="rotate(-90)" x="${-(T + H - B) / 2}" y="12" text-anchor="middle">مقياس نسبي</text>`;
  const sers = [[gel, 'var(--water)', 'gel/polymer في الماء'], [solids, 'var(--ink)', 'proppant وصلب'], [gas, 'var(--gas)', 'غاز'], [oil, 'var(--oil)', 'نفط']];
  sers.forEach(([f, c, l], i) => { s += `<path d="${curve(f)}" style="fill:none;stroke:${c};stroke-width:2.4"/><line x1="${W - R - 150}" x2="${W - R - 132}" y1="${T + 8 + i * 16}" y2="${T + 8 + i * 16}" style="stroke:${c};stroke-width:2.4"/><text class="tt" x="${W - R - 126}" y="${T + 12 + i * 16}">${l}</text>`; });
  return s + '</svg>';
}

/* ===== Calculators ===== */
const out = (id, html) => { const e = document.getElementById('o_' + id); if (e) e.innerHTML = html; };
const dens = api => 62.4 * apiToSG(api);
const muWaterCp = TF => { const TK = (TF - 32) / 1.8 + 273.15; return 2.414e-5 * Math.pow(10, 247.8 / (TK - 140)) * 1000; };

function caseObj() { return caseVals(); }

RUN.stream = () => {
  const c = caseObj(); if (![c.qL, c.wc, c.gor, c.api, c.gg, c.Tres].every(isFinite)) return;
  const b = stageBalance(c);
  const names = [['HP separator', c.Psep1], ['LP separator', c.Psep2], ['Stock tank / VRU', 0]];
  const rows = names.map(([n, p], i) => `<tr><td>${n}</td><td class="n">${fmt(p, 0)}</td><td class="n">${fmt(b.gas[i] * 1000, 1)}</td><td class="n">${fmt(b.frac[i] * 100, 1)}%</td></tr>`).join('');

   ${sat ? MSG('Pr أقل من Pb: المكمن saturated، فالـ GOR المُدخَل قد لا يمثل الـ solution GOR. الحساب هنا تقريبي.', 'warn') : MSG('Pr أعلى من Pb: المكمن undersaturated، فالنفط يصل البئر مذاباً فيه الغاز ويتحرر لاحقاً. هذا هو سبب الـ shrinkage.', '')}</div>
   <div class="out"><div class="tblwrap"><table><thead><tr><th>المرحلة</th><th class="n">psig</th><th class="n">Mscf/d</th><th class="n">حصة الغاز</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${MSG('توزيع الغاز على المراحل مقدَّر من Standing؛ يميل لتقدير غاز المرحلة الأولى أعلى مما يحدث في الواقع. التوزيع الحقيقي يحتاج flash لتركيب المائع.', '')}</div></div>`;
  const casesum = `API ${c.api} · GOR ${c.gor} · WC ${c.wc}% · q ${fmt(c.qL, 0)} · Pr ${fmt(c.Pr, 0)} · FWHP ${c.Pwh}`; $('#casesum').textContent = casesum;
};

RUN.fall = () => {
  const c = caseObj(); if (![c.Pr, c.Pwh, c.Pchk, c.Psep1, c.Psep2, c.J, c.qL].every(isFinite)) return;
  const b = stageBalance(c);
  const pwfI = iprPwf(c.qL, c.Pr, b.Pb, c.J);
  const qmax = iprQmax(c.Pr, b.Pb, c.J);
  const lv = [c.Pr - 14.696, pwfI - 14.696, c.Pwh, c.Pchk, c.Psep1, c.Psep2, 0];
  const names = ['Drawdown', 'Tubing', 'Choke', 'Flowline', 'HP→LP', 'LP→tank'];
  const cols = ['var(--oil)', 'var(--accent)', 'var(--gas)', 'var(--muted)', 'var(--water)', 'var(--water)'];
  const W = 640, H = 300, L = 56, R = 12, T = 18, B = 40, ym = niceMax(lv[0] * 1.05);
  const Y = v => T + (1 - Math.max(v, 0) / ym) * (H - T - B), bw = (W - L - R) / 6;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم شلال الضغط من المكمن حتى الخزان">`;
  for (let i = 0; i <= 4; i++) { const v = ym * i / 4; s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`; }
  s += `<text transform="rotate(-90)" x="${-(T + H - B) / 2}" y="12" text-anchor="middle">psig</text>`;
  for (let i = 0; i < 6; i++) {
    const hi = Math.max(lv[i], lv[i + 1]), lo = Math.min(lv[i], lv[i + 1]), x = L + i * bw + 6;
    s += `<rect x="${x}" y="${Y(hi)}" width="${bw - 12}" height="${Math.max(Y(lo) - Y(hi), 1)}" style="fill:${cols[i]};opacity:.85"/>`;
    s += `<text x="${x + (bw - 12) / 2}" y="${Y(hi) - 5}" text-anchor="middle" class="tt">${fmt(lv[i] - lv[i + 1], 0)}</text><text x="${x + (bw - 12) / 2}" y="${H - B + 15}" text-anchor="middle">${names[i]}</text>`;
  }
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/></svg>`;
  $('#o_fall').innerHTML = `<figure>${s}<figcaption>كل عمود هو الضغط المفقود في مرحلة (psi). المجموع من Pr حتى الخزان.</figcaption></figure>`;
  /* consistency: VLP vs IPR at qL */
  const lift = vlpParams(c, 'none');
  const v = vlpPwf(c.qL, lift);
  let msg = '';
  if (!(c.qL < qmax)) msg = MSG(`المعدل المُدخَل (${fmt(c.qL, 0)}) أكبر من qmax للمكمن (${fmt(qmax, 0)} bbl/d).`, 'bad');
  else if (!isFinite(v.pwf)) msg = MSG('VLP لم يُحسب (ضغط سالب أو غير واقعي).', 'bad');
  else {
    const d = v.pwf - pwfI;
    msg = Math.abs(d) < 150 ? MSG(`متسق: الـ tubing يحتاج Pwf ≈ ${fmt(v.pwf, 0)} psia والمكمن يعطي ${fmt(pwfI, 0)} psia عند هذا المعدل.`, 'ok')
      : d > 0 ? MSG(`غير متسق: الـ tubing يحتاج Pwf ≈ ${fmt(v.pwf, 0)} psia لكن المكمن لا يعطي إلا ${fmt(pwfI, 0)} psia عند هذا المعدل. البئر لن يصل هذا المعدل بدون رفع أو خفض ضغط السطح.`, 'warn')
        : MSG(`الـ tubing يحتاج ${fmt(v.pwf, 0)} psia والمكمن يعطي ${fmt(pwfI, 0)}: هناك فائض ضغط ≈ ${fmt(-d, 0)} psi، فيمكن رفع المعدل أو زيادة الاختناق.`, 'ok');
  }
  const ratio = (c.Pchk + 14.696) / (c.Pwh + 14.696);
  $('#o_fallnote').innerHTML = `<div class="out">${msg}${MSG(`نسبة ضغط الـ choke (downstream/upstream) = ${fmt(ratio, 2)}. ${ratio < 0.55 ? 'أقل من ≈ 0.55: تدفق حرج، فضغط المنشأة لا يؤثر على معدل البئر.' : 'أعلى من ≈ 0.55: تدفق تحت حرج، فتغيّر ضغط السطح سيغيّر معدل البئر.'}`, ratio < 0.55 ? 'ok' : 'warn')}

function vlpParams(c, mode) {
  const g = (id, d) => { const e = document.getElementById(id); const v = e ? parseFloat(e.value) : NaN; return isFinite(v) ? v : d; };
  const p = { whp: c.Pwh + 14.696, TVD: c.TVD, MD: Math.max(g('n_MD', c.TVD), c.TVD), id: c.id, Twh: g('n_Twh', 110), Tbh: c.Tres, wc: c.wc / 100, gor: c.gor, api: c.api, gg: c.gg, gw: 1.05, eps: g('n_eps', 0.0006), muL: g('n_mu', 3), N: 40, glrInj: 0, zInj: 0, dpPump: 0, zPump: 0 };
  if (mode === 'gl') { p.glrInj = g('n_glr', 0); p.zInj = Math.min(g('n_zinj', 0), c.TVD); }
  if (mode === 'esp') { p.dpPump = g('n_dpp', 0); p.zPump = Math.min(g('n_zp', 0), c.TVD); }

RUN.nodal = () => {
  const c = caseObj(); if (![c.Pr, c.J, c.TVD, c.id, c.gor, c.api].every(isFinite)) return;
  const mode = document.getElementById('n_mode').value;
  const b = stageBalance(c), Pb = b.Pb;

  const qmax = iprQmax(c.Pr, Pb, c.J);
  const base = nodalSolve(p0, c.Pr, Pb, c.J);
  const lifted = mode === 'none' ? base : nodalSolve(p1, c.Pr, Pb, c.J);

  if (mode !== 'none') series.push({ pts: v1, color: 'var(--accent)', label: mode === 'gl' ? 'VLP مع gas lift' : 'VLP مع ESP' });
  const marks = []; const res = lifted;

    if (mode !== 'none' && base.q) det += MSG(`المكسب من الرفع: ${fmt(res.q - base.q, 0)} bbl/d (من ${fmt(base.q, 0)} إلى ${fmt(res.q, 0)}).`, 'ok');

RUN.heat = () => {

  $('#o_heat').innerHTML = `<div class="kvs">${KV('الحمل الحراري', fmt(Q / 1e6, 2), 'MMBTU/hr')}${KV('يومياً', fmt(Q * 24 / 1e6, 1), 'MMBTU/d')}${KV('غاز الوقود', fmt(fuel, 1), 'Mscf/d')}${KV('cp النفط', fmt(cpo, 3), 'BTU/lb·°F')}${KV('μ النفط عند الدخول', fmt(m1, 1), 'cP')}${KV('μ النفط عند الخروج', fmt(m2, 1), 'cP')}${KV('نسبة الخفض', fmt(m1 / m2, 1), '×')}</div>

  if (!Object.values(p).every(isFinite) || p.P2 <= p.P1 || p.rmax <= 1) { out('comp', MSG('ضغط التفريغ يجب أن يكون أعلى من الشفط.', 'warn')); return; }
  const r = compressor(p);
  out('comp', `<div class="kvs">${KV('Ratio كلي', fmt(r.r, 2))}${KV('عدد المراحل', fmt(r.n, 0))}${KV('Ratio/stage', fmt(r.rs, 2))}${KV('القدرة/مرحلة', fmt(r.hpStage, 0), 'hp')}${KV('القدرة الكلية', fmt(r.hpTot, 0), 'hp', 'ok')}${KV('hp لكل MMscf/d', fmt(r.hpTot / p.Q, 0))}${KV('T التفريغ/مرحلة', fmt(r.Td, 0), '°F', r.Td > 325 ? 'warn' : '')}${KV('Z عند الشفط', fmt(r.Z, 3))}${KV('ACFM عند الشفط', fmt(r.acfm, 0))}</div>
   ${r.Td > 325 ? MSG('درجة حرارة التفريغ مرتفعة: يحدّها تلف الزيوت/الحشوات وغالباً تُحدّد بـ ≈ 300–350°F؛ زد عدد المراحل أو راجع الكفاءة.', 'warn') : ''}${MSG('القدرة المحسوبة على عمود الإدارة (bhp) بدون فقد ميكانيكي وفقد الـ valves. أضف ≈ 5–10% للفقد الميكانيكي حسب نوع الضاغط.')}`);
};
FILL.comp = () => { const c = caseObj(); const b = stageBalance(c); setv('g_Q', +b.gasTot.toFixed(3)); setv('g_p1', c.Psep1); setv('g_gg', c.gg); };

RUN.hyd = () => {
  const dT = num('y_dT'), key = document.getElementById('y_in').value, qw = num('y_qw'), sg = num('y_sg');
  if (![dT, qw, sg].every(isFinite)) return;
  const W = hammerschmidt(dT, key), mw = qw * C.lbPerBblW * sg, mi = mw * W / (100 - W);
  const gal = mi / INHIB[key].lbGal;
  out('hyd', `<div class="kvs">${KV('التركيز في الطور المائي', fmt(W, 1), 'wt%', W > 25 ? 'warn' : 'ok')}${KV('المثبط النقي', fmt(mi, 0), 'lb/d')}${KV('الحجم', fmt(gal, 0), 'gal/d')}${KV('لكل bbl ماء', fmt(gal / qw, 2), 'gal')}</div>
   ${W > 25 ? MSG('W > ≈ 25 wt%: الصيغة تفقد دقتها؛ استخدم برنامج hydrate.', 'warn') : ''}
   ${key === 'MeOH' ? MSG('Methanol يتوزع أيضاً في الغاز والنفط (فقد في الطور البخاري) ولا يُحسب هنا: الجرعة الفعلية أعلى. MEG أقل فقداً ويُسترجع بالـ regeneration.') : MSG('MEG غالباً يُسترجع ويُعاد حقنه؛ تُضبط الجرعة بحسب تركيز الـ lean MEG المحقون (هنا افترضنا نقياً).')}`);
};

RUN.pw = () => {
  const Q = num('w_Q'), A = num('w_A'), T = num('w_T'), sg = num('w_sg'), api = num('w_api'), tgt = num('w_tgt');
  if (![Q, A, T, sg, api, tgt].every(isFinite)) return;
  const mu = muWaterCp(T) * 1e-3, rw = sg * 999.016, ro = 999.016 * apiToSG(api);
  const vs = Q * 0.158987 / 86400 / (A * 0.092903), dc = stokesCut(vs, rw - ro, mu);
  const vt = stokesV(tgt * 1e-6, rw - ro, mu), Areq = Q * 0.158987 / 86400 / vt / 0.092903;
  out('pw', `<div class="kvs">${KV('μ الماء', fmt(mu * 1000, 3), 'cP')}${KV('Δρ', fmt(rw - ro, 0), 'kg/m³')}${KV('Q/A', fmt(vs * 1000, 3), 'mm/s')}${KV('أصغر قطرة تُزال', fmt(dc * 1e6, 1), 'µm', dc * 1e6 <= tgt ? 'ok' : 'warn')}${KV(`المساحة لإزالة ${tgt} µm`, fmt(Areq, 0), 'ft²')}</div>
   ${dc * 1e6 <= tgt ? MSG('المساحة الحالية كافية للقطرة المستهدفة (في وحدة مثالية بدون short-circuiting).', 'ok') : MSG('المساحة الحالية لا تكفي: تحتاج مساحة أكبر أو حرارة أعلى أو تلاحم (coalescing media/CPI).', 'warn')}
   ${MSG('الوحدات الحقيقية تقلّ كفاءتها عن المثالية (قصر مسار، اضطراب)؛ تُعتمد معاملات أمان 1.5–2× على المساحة عادةً.')}`);
};
FILL.pw = () => { const c = caseObj(); const b = stageBalance(c); setv('w_Q', Math.round(b.qw)); setv('w_T', c.Ts); setv('w_api', c.api); };

RUN.tank = () => {
  const d = num('t_d'), h = num('t_h'), fw = num('t_fw'), T = num('t_T'), api = num('t_api'), bsw = num('t_bsw');
  if (![d, h, fw, T, api, bsw].every(isFinite)) return;
  const bpf = tankBblPerFt(d), tov = bpf * h, fwv = bpf * fw, gov = tov - fwv;
  const cc = crudeCorr(api, T), gsv = gov * cc.vcf, nsv = gsv * (1 - bsw / 100);
  out('tank', `<div class="kvs">${KV('سعة لكل قدم', fmt(bpf, 1), 'bbl/ft')}${KV('TOV', fmt(tov, 0), 'bbl')}${KV('ماء حر', fmt(fwv, 0), 'bbl')}${KV('GOV', fmt(gov, 0), 'bbl')}${KV('API عند 60°F', fmt(cc.api60, 1), '°API')}${KV('VCF', fmt(cc.vcf, 4))}${KV('GSV', fmt(gsv, 0), 'bbl')}${KV('NSV', fmt(nsv, 0), 'bbl', 'ok')}</div>
   ${MSG(`الفرق بين TOV و NSV: ${fmt(tov - nsv, 0)} bbl (${fmt((tov - nsv) / tov * 100, 2)}%). هذا ما يفصل "ما قرأته على المقياس" عن "ما تُحاسب عليه".`)}`);
};

RUN.farm = () => {
  const q = num('f_q'), days = num('f_days'), d = num('f_d'), h = num('f_h'), fill = num('f_fill') / 100;
  if (![q, days, d, h, fill].every(isFinite)) return;
  const nom = tankBblPerFt(d) * h, work = nom * fill, need = q * days, n = Math.ceil(need / work);
  out('farm', `<div class="kvs">${KV('السعة الاسمية/خزان', fmt(nom, 0), 'bbl')}${KV('السعة العاملة', fmt(work, 0), 'bbl')}${KV('المطلوب', fmt(need, 0), 'bbl')}${KV('عدد الخزانات', fmt(n, 0), '', 'ok')}${KV('مع N+1', fmt(n + 1, 0))}</div>`);
};
FILL.farm = () => { const c = caseObj(); const b = stageBalance(c); setv('f_q', Math.round(b.qo)); };

RUN.pipe = () => {
  const p = { Q: num('p_Q'), id: num('p_id'), Lmi: num('p_L'), eps: num('p_eps'), api: num('p_api'), mu: num('p_mu'), dz: num('p_dz'), Pdel: num('p_pd') };
  const maop = num('p_maop'), eta = num('p_eta') / 100;
  if (!Object.values(p).every(isFinite) || !isFinite(maop) || !isFinite(eta) || eta <= 0) return;
  const r = pipeline(p);
  const st = Math.max(1, Math.ceil(r.Pdis / maop));
  const hpS = r.hpH / eta;
  out('pipe', `<div class="kvs">${KV('السرعة', fmt(r.v, 2), 'ft/s')}${KV('Reynolds', fmt(r.Re, 0))}${KV('f', fmt(r.f, 4))}${KV('ΔP احتكاك/ميل', fmt(r.dpPerMi, 1), 'psi/mi')}${KV('ΔP احتكاك', fmt(r.dpF, 0), 'psi')}${KV('ΔP ارتفاع', fmt(r.dpS, 0), 'psi')}${KV('ضغط التفريغ المطلوب', fmt(r.Pdis, 0), 'psig', r.Pdis > maop ? 'bad' : 'ok')}${KV('hp هيدروليكي', fmt(r.hpH, 0), 'hp')}${KV('hp على العمود', fmt(hpS, 0), 'hp')}${KV('زمن العبور', fmt(r.hrs, 1), 'h')}${KV('حجم الخط', fmt(r.vol, 0), 'bbl')}</div>
   ${r.lam ? MSG('تدفق رقائقي (laminar): نادر للخام الخفيف، شائع لثقيل جداً/بارد؛ الاحتكاك يتناسب خطياً مع اللزوجة.', 'warn') : ''}
   ${r.Pdis > maop ? MSG(`ضغط التفريغ يتجاوز MAOP: تحتاج ≈ ${st} محطات ضخ على الأقل، أو قطراً أكبر.`, 'bad') : MSG('ضمن MAOP لمحطة ضخ واحدة.', 'ok')}
   ${MSG('الاحتكاك يتناسب تقريباً مع Q^1.8–2 ومع 1/D^4.8–5: مضاعفة القطر تخفض الاحتكاك ≈ 25 مرة. هذا هو سبب أن تكبير الخط غالباً أرخص من محطات ضخ إضافية.')}`);
};
FILL.pipe = () => { const c = caseObj(); setv('p_api', c.api); };

RUN.frac = () => {
  const d = num('x_d') * 1e-6, h = num('x_h') * 0.0254, mu0 = num('x_mu'), sg = num('x_sg'), api = num('x_api');
  if (![d, h, mu0, sg, api].every(isFinite) || mu0 <= 0) return;
  const drho = sg * 999.016 - 999.016 * apiToSG(api);
  const mult = [1, 2, 5, 10, 30, 100];
  const t0 = h / stokesV(d, drho, mu0 * 1e-3);
  const rows = mult.map(m => { const mu = mu0 * m, v = stokesV(d, drho, mu * 1e-3), t = h / v; return `<tr><td class="n">${fmt(mu, 1)}</td><td class="n">${m}×</td><td class="n">${fmt(v * 1000, 3)}</td><td class="n">${t < 3600 ? fmt(t / 60, 1) + ' min' : fmt(t / 3600, 1) + ' h'}</td></tr>`; }).join('');
  out('frac', `<div class="tblwrap"><table><thead><tr><th class="n">μ الماء (cP)</th><th class="n">× النظيف</th><th class="n">v (mm/s)</th><th class="n">زمن الطفو</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${MSG(`في الماء النظيف تحتاج القطرة ${fmt(t0 / 60, 1)} دقيقة لتصعد ${num('x_h')} بوصة. مع لزوجة 10× يصبح الزمن ${fmt(t0 * 10 / 60, 0)} دقيقة: الـ retention time المصمّم لن يكفي.`, 'warn')}`);
};

}
const HFCACHE = {};
function hfRate(t, qm) { if (t < 0.04) return 0; if (t < 0.12) return 10 * sm(0.04, 0.05, t); if (t < 0.14) return 12; if (t < 0.20) return 0; if (t < 0.22) return qm * sm(0.20, 0.22, t); if (t < 0.80) return qm; return 0; }
function hfProp(t, cm) { if (t < 0.36 || t >= 0.74) return 0; const lv = [0.125, 0.25, 0.5, 0.75, 1]; return cm * lv[Math.min(4, Math.floor((t - 0.36) / 0.076))]; }
function hfPn(t) {
  if (t < 0.04) return 0;
  if (t < 0.075) return 1.35 * sm(0.04, 0.075, t);
  if (t < 0.085) return 1.35 - 0.6 * sm(0.075, 0.085, t);
  if (t < 0.12) return 0.75 + 0.05 * sm(0.085, 0.12, t);
  if (t < 0.14) return 0.85;
  if (t < 0.20) return 0.85 * Math.exp(-(t - 0.14) / 0.022) + 0.02;
  if (t < 0.22) return 0.05 + 0.85 * sm(0.20, 0.22, t);
  if (t < 0.80) { let p = 0.9 + 0.22 * Math.sqrt((t - 0.22) / 0.58); if (t >= 0.36 && t < 0.74) p += 0.015 * Math.floor((t - 0.36) / 0.076); return p; }
  if (t < 0.88) return 1.05 * (1 - sm(0.80, 0.88, t));
  return 0;
}
function hfLen(t) {
  if (t < 0.04) return 0;
  if (t < 0.12) return 0.05 * sm(0.04, 0.085, t);
  if (t < 0.20) return 0.05 + 0.05 * sm(0.12, 0.14, t);
  if (t < 0.80) return 0.10 + 0.90 * Math.pow((Math.min(t, 0.80) - 0.20) / 0.60, 0.8);
  return 1;
}
function hfState(t) {
  const P = hfParams(), pn = hfPn(t), q = hfRate(t, P.q), c = hfProp(t, P.cmax);
  const sig = HFCACHE.sigC || P.Gf * P.TVD;
  const pp = HFCACHE.pp || 0.44 * P.TVD;
  const bhp = pn > 0.001 ? sig + pn * P.pnet : pp;
  const rho = slurryDensity(c, P.spg);
  const ps = bhp - 0.052 * rho * P.TVD + P.fric * Math.pow(q / Math.max(P.q, 1), 1.8);
  return { pn, q, c, bhp, ps: Math.max(ps, 0), L: hfLen(t), sig };
}
function hfPhaseOf(t) { for (const p of HF_PH) if (t >= p[2] && t < p[3]) return p; return HF_PH[HF_PH.length - 1]; }

    { y0: 94, h: 70, key: 'q', col: 'var(--water)', lab: 'rate (bpm)', f: t => hfState(t).q },

  panels.forEach(p => {

    s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${p.y0 + p.h}" y2="${p.y0 + p.h}"/><text x="${L - 6}" y="${p.y0 + 10}" text-anchor="end">${fmt(mx / 1.08, 0)}</text><text x="${L - 6}" y="${p.y0 + p.h}" text-anchor="end">0</text><text class="tt" x="${L + 6}" y="${p.y0 + 11}" style="fill:${p.col}">${p.lab}</text>`;

function hfLoop(ts) {
  if (!HFS.playing) return;

function hfInit() {
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'hf_t') { HFS.playing = false; const b = document.getElementById('hf_play'); if (b) b.textContent = 'تشغيل'; hfSetT(+t.value / 1000); }
    if (t.id === 'hf_fl') { HFS.fluid = t.value; hfUpdateUI(); }
    if (t.id === 'hf_mu') hfUpdateUI();
    if (t.id === 'hf_cmax') hfRefresh();
    if (t.id === 'hf_bar') { HFS.barrier = t.value; hfUpdateUI(); }
    if (t.id === 'hf_brk') { HFS.breaker = t.value; hfUpdateUI(); }
    if (t.id === 'pp_v') { PP.playing = false; const b = document.getElementById('pp_play'); if (b) b.textContent = 'تشغيل'; PP.v = +t.value; ppRender(); }
  });
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'hf_play') return hfPlay(!HFS.playing);
    if (t.id === 'hf_rst') { hfPlay(false); hfSetT(0); return; }
    const ch = t.closest('.phchip'); if (ch) { const p = HF_PH.find(x => x[0] === ch.dataset.ph); hfPlay(false); hfSetT(p[2] + (p[3] - p[2]) * 0.55); return; }
    if (t.id === 'pp_play') { PP.playing = !PP.playing; PP.last = 0; t.textContent = PP.playing ? 'إيقاف مؤقت' : 'تشغيل'; if (PP.playing) { if (PP.v >= 800) PP.v = 0; requestAnimationFrame(ppLoop); } return; }
    const eq = t.closest('#spreadsvg .eqn'); if (eq && HFS.eq) HFS.eq(eq.dataset.eq);
    const eb = t.closest('[data-eqb]'); if (eb && HFS.eq) HFS.eq(eb.dataset.eqb);
  });
  document.addEventListener('keydown', e => { const eq = e.target.closest && e.target.closest('#spreadsvg .eqn'); if (eq && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); HFS.eq(eq.dataset.eq); } });
  window.addEventListener('resize', () => hfDraw());
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', () => hfDraw()); }
}

/* ===== Realistic illustrations (isometric scenes, rock texture, gauges, grain close-up) ===== */
const mkP = (k, ox, oy) => (x, y, z) => [ox + (x - y) * 0.866 * k, oy + (x + y) * 0.5 * k - z * k];
const pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = f > 0 ? 255 : 0, a = Math.abs(f);
  r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const ST = 'stroke:rgba(0,0,0,.5);stroke-width:.7;stroke-linejoin:round';
function isoBox(P, x, y, z, w, d, h, col, o = {}) {
  const top = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];
  const right = [P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)];
  const left = [P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)];
  let s = `<polygon points="${pts(right)}" style="fill:${shade(col, -0.3)};${ST}"/><polygon points="${pts(left)}" style="fill:${shade(col, -0.08)};${ST}"/><polygon points="${pts(top)}" style="fill:${shade(col, 0.22)};${ST}"/>`;
  if (o.ribs) {
    let l = ''; for (let xi = x + o.ribs; xi < x + w - 0.01; xi += o.ribs) l += `M${P(xi, y + d, z + 0.15).map(v => v.toFixed(1)).join(' ')}L${P(xi, y + d, z + h - 0.15).map(v => v.toFixed(1)).join(' ')}`;
    for (let yi = y + o.ribs; yi < y + d - 0.01; yi += o.ribs) l += `M${P(x + w, yi, z + 0.15).map(v => v.toFixed(1)).join(' ')}L${P(x + w, yi, z + h - 0.15).map(v => v.toFixed(1)).join(' ')}`;
    s += `<path d="${l}" style="fill:none;stroke:rgba(0,0,0,.28);stroke-width:.7"/>`;
  }
  return s;
}
function isoCyl(P, k, gid, cx, cy, z, r, h, col) {
  const [tx, ty] = P(cx, cy, z + h), [bx, by] = P(cx, cy, z), rx = 1.2247 * k * r, ry = 0.7071 * k * r;
  const f = (a, b) => a.toFixed(1) + ' ' + b.toFixed(1);
  return `<path d="M${f(tx - rx, ty)}L${f(bx - rx, by)}A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${f(bx + rx, by)}L${f(tx + rx, ty)}A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${f(tx - rx, ty)}Z" style="fill:url(#${gid(col)});${ST}"/><ellipse cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" style="fill:${shade(col, 0.28)};${ST}"/>`;
}
function isoWheel(P, cx, y, cz, r, hub) {
  const ring = [], hubp = []; for (let a = 0; a < 360; a += 20) { const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180); ring.push(P(cx + r * c, y, cz + r * s)); hubp.push(P(cx + r * 0.45 * c, y, cz + r * 0.45 * s)); }
  return `<polygon points="${pts(ring)}" style="fill:#15181b;stroke:#000;stroke-width:.6"/><polygon points="${pts(hubp)}" style="fill:${hub || '#9aa0a6'}"/>`;
}
function shadowP(P, x, y, w, d, h) { const o = h * 0.55, q = [P(x + o, y - o * 0.5, 0), P(x + w + o, y - o * 0.5, 0), P(x + w + o, y + d - o * 0.5, 0), P(x + w, y + d, 0), P(x, y + d, 0), P(x, y, 0)]; return `<polygon points="${pts(q)}" style="fill:rgba(0,0,0,.2)"/>`; }
function tagP(P, x, y, z, en, ar, dx = 0, dy = 0) {
  const [ax, ay] = P(x, y, z), sx = ax + dx, sy = ay + dy, w = Math.max(en.length * 7.4, (ar || '').length * 6.4) + 14, h = ar ? 34 : 20;
  return `<g class="tagp" pointer-events="none"><line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" style="stroke:var(--muted);stroke-width:1"/><rect x="${(sx - w / 2).toFixed(1)}" y="${(sy - h).toFixed(1)}" width="${w.toFixed(0)}" height="${h}" rx="4" style="fill:var(--surface);opacity:.9;stroke:var(--line)"/><text x="${sx.toFixed(1)}" y="${(sy - h + 14).toFixed(1)}" text-anchor="middle" class="tg1">${en}</text>${ar ? `<text x="${sx.toFixed(1)}" y="${(sy - 5).toFixed(1)}" text-anchor="middle" class="tg2">${ar}</text>` : ''}</g>`;
}

function spreadSVG() {
  const k = 10.4, P = mkP(k, 405, 70), defs = new Map();

  const cyl = (cx, cy, z, r, h, col) => isoCyl(P, k, gid, cx, cy, z, r, h, col);
  const box = (x, y, z, w, d, h, col, o) => isoBox(P, x, y, z, w, d, h, col, o);
  const G = {};
  /* ground */
  let ground = `<polygon points="${pts([P(-3, -3, 0), P(58, -3, 0), P(58, 36, 0), P(-3, 36, 0)])}" style="fill:var(--earth);stroke:var(--line)"/><polygon points="${pts([P(-1, -1, 0), P(56, -1, 0), P(56, 34, 0), P(-1, 34, 0)])}" style="fill:color-mix(in srgb,var(--earth) 78%,#fff 22%)"/>`;
  for (let i = 0; i < 260; i++) { const x = -1 + hash(i, 1) * 57, y = -1 + hash(i, 2) * 35, p = P(x, y, 0); ground += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(0.7 + hash(i, 3) * 1.2).toFixed(1)}" style="fill:rgba(0,0,0,${(0.05 + hash(i, 4) * 0.08).toFixed(2)})"/>`; }
  const road = `<polygon points="${pts([P(-3, 36.5, 0), P(58, 36.5, 0), P(58, 40, 0), P(-3, 40, 0)])}" style="fill:var(--earth2)"/><path d="M${P(-2, 38.2, 0).join(' ')}L${P(57, 38.2, 0).join(' ')}" style="stroke:var(--muted);stroke-width:1.4;stroke-dasharray:9 8;fill:none"/>`;
  /* hoses (under equipment) */
  const hose = (arr, cls) => `<polyline class="${cls}" points="${pts(arr.map(a => P(a[0], a[1], a[2] ?? 0.55)))}"/>`;
  let lines = '';
  [0, 1, 2].forEach(i => { lines += hose([[11, i * 4.4 + 1.7], [13, i * 4.4 + 1.7], [13, 14.3], [14.5, 14.3]], 'sl2 lw flow'); });
  lines += hose([[6.5, 28.6], [12, 28.6], [12, 16], [14.5, 16]], 'sl2 lc flow');

  for (const k in cls) sv.classList.toggle(k, !!cls[k]);

function opsReadouts() {

function opsTick(dtReal) {
  if (!OPS.run) return;
  const c = caseObj(), bal = stageBalance(c), f = OPS.esd ? 0 : OPS.choke / 100, cap = tankBblPerFt(60) * 32, dh = dtReal * OPS.spd;
  const inflow = bal.qo * f / 24 * dh / 2, outRate = 2 * bal.qo / 24 * dh / 2;
  [['A'], ['B']].forEach(([k]) => { let v = OPS[k] + inflow / cap; if (OPS.exp && !OPS.esd && v > 0.03) v -= outRate / cap; OPS[k] = clamp01(v); });
  if (OPS.exp && OPS.A < 0.035 && OPS.B < 0.035) { OPS.exp = false; opsUpdateStatic(); }
  if (!OPS.esd && (OPS.A >= 0.95 || OPS.B >= 0.95)) { OPS.esd = true; OPS.reason = 'LSHH: مستوى الخزان بلغ 95%'; opsUpdateStatic(); }
}
function opsLoop(ts) { if (!OPS.run) return; if (!OPS.last) OPS.last = ts; const dt = Math.min((ts - OPS.last) / 1000, 0.1); OPS.last = ts; opsTick(dt); opsReadouts(); requestAnimationFrame(opsLoop); }
function opsInit() {
  opsUpdateStatic(); opsReadouts(); OPS.last = 0; requestAnimationFrame(opsLoop);
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'op_run') { OPS.run = !OPS.run; OPS.last = 0; opsUpdateStatic(); if (OPS.run) requestAnimationFrame(opsLoop); }
    if (t.id === 'op_comp') { OPS.comp = !OPS.comp; opsUpdateStatic(); opsReadouts(); }
    if (t.id === 'op_exp') { OPS.exp = !OPS.exp; if (OPS.exp) OPS.esd = OPS.esd; opsUpdateStatic(); opsReadouts(); }
    if (t.id === 'op_esd') { OPS.esd = !OPS.esd; OPS.reason = ''; if (!OPS.esd) { OPS.A = Math.min(OPS.A, 0.9); OPS.B = Math.min(OPS.B, 0.9); } opsUpdateStatic(); opsReadouts(); }
  });
  document.addEventListener('input', e => { const t = e.target; if (t.id === 'op_choke') { OPS.choke = +t.value; opsUpdateStatic(); opsReadouts(); } if (t.id === 'op_spd') { OPS.spd = +t.value; } if (t.closest && t.closest('#case')) opsReadouts(); });
}
