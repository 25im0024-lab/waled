name: IELTS Coach checks

on:
  push:
    paths: ['ielts/**', '.github/workflows/ielts-ci.yml']
  pull_request:
    paths: ['ielts/**', '.github/workflows/ielts-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ielts/tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content (answer keys, counts, chart data)
        run: node validate-data.js
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node e2e/run.js
